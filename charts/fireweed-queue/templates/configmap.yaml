apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fireweed-queue.fullname" . }}-config
  labels:
    {{- include "fireweed-queue.labels" . | nindent 4 }}
data:
  FIREWEED_LISTEN_ADDR: {{ .Values.config.listenAddr | quote }}
  FIREWEED_REPLICA_COUNT: {{ .Values.replicaCount | quote }}
  FIREWEED_LOG_BACKEND: {{ .Values.storage.log.backend | quote }}
  FIREWEED_PROJECTION_BACKEND: {{ .Values.storage.projection.backend | quote }}
  FIREWEED_CONTROL_PLANE: {{ .Values.storage.controlPlane.backend | quote }}
  FIREWEED_PRINCIPAL_ID: {{ .Values.config.principalId | quote }}
  FIREWEED_TENANTS: {{ join "," .Values.config.tenants | quote }}
  {{- if gt (len .Values.bootstrap.queues) 0 }}
  FIREWEED_BOOTSTRAP_QUEUES: {{ join "," .Values.bootstrap.queues | quote }}
  {{- else if gt (int .Values.bootstrap.generated.count) 0 }}
  FIREWEED_BOOTSTRAP_GENERATED_COUNT: {{ .Values.bootstrap.generated.count | quote }}
  FIREWEED_BOOTSTRAP_GENERATED_TENANT: {{ .Values.bootstrap.generated.tenant | quote }}
  FIREWEED_BOOTSTRAP_GENERATED_PREFIX: {{ .Values.bootstrap.generated.prefix | quote }}
  {{- end }}
  FIREWEED_SHARD_COUNT_MIN: {{ .Values.storage.shardCount.min | quote }}
  FIREWEED_SHARD_COUNT_MAX: {{ .Values.storage.shardCount.max | quote }}
  {{- if eq .Values.storage.controlPlane.backend "postgres" }}
  FIREWEED_CONTROL_PLANE_HEARTBEAT_TTL_MS: {{ .Values.storage.controlPlane.postgres.heartbeatTtlMs | int64 | quote }}
  FIREWEED_CONTROL_PLANE_LEASE_TTL_MS: {{ .Values.storage.controlPlane.postgres.leaseTtlMs | int64 | quote }}
  {{- end }}
  {{- /* Compat: legacy objectlog still injects OBJECT_LOG_STORE for the server adapter. */}}
  {{- if eq .Values.storage.log.backend "objectlog" }}
  FIREWEED_OBJECT_LOG_STORE: {{ .Values.storage.log.objectLog.store | quote }}
  {{- end }}
  {{- if eq (include "fireweed-queue.logIsFilesystemLocal" .) "true" }}
  FIREWEED_OBJECT_LOG_ROOT: {{ .Values.storage.log.objectLog.root | quote }}
  {{- end }}
  {{- if eq (include "fireweed-queue.logIsS3" .) "true" }}
  FIREWEED_OBJECT_LOG_S3_ENDPOINT: {{ .Values.storage.log.objectLog.s3.endpoint | quote }}
  FIREWEED_OBJECT_LOG_S3_BUCKET: {{ .Values.storage.log.objectLog.s3.bucket | quote }}
  FIREWEED_OBJECT_LOG_S3_REGION: {{ .Values.storage.log.objectLog.s3.region | quote }}
  FIREWEED_OBJECT_LOG_S3_CREDENTIAL_SOURCE: "static"
  FIREWEED_OBJECT_LOG_S3_ALLOW_INSECURE_HTTP: {{ .Values.storage.log.objectLog.s3.allowInsecureHttp | quote }}
  {{- end }}
  {{- if eq .Values.storage.log.backend "sqlite" }}
  FIREWEED_SQLITE_LOG_PATH: {{ .Values.storage.log.sqlite.path | quote }}
  {{- end }}
  {{- if or (eq .Values.storage.projection.backend "sqlite") (eq .Values.storage.projection.backend "hybrid") (eq .Values.storage.projection.backend "hybrid-async") }}
  FIREWEED_SQLITE_PROJECTION_PATH: {{ .Values.storage.projection.sqlite.path | quote }}
  {{- end }}
  {{- if eq .Values.storage.projection.backend "turso" }}
  FIREWEED_TURSO_PROJECTION_PATH: {{ .Values.storage.projection.turso.path | quote }}
  {{- end }}
  {{- if eq .Values.storage.projection.backend "hybrid-async" }}
  FIREWEED_HYBRID_ASYNC_APPLY_LAG_MAX_COMMANDS: {{ .Values.storage.projection.hybridAsync.applyLagMaxCommands | int64 | quote }}
  FIREWEED_HYBRID_ASYNC_APPLY_DEBT_MAX_BYTES: {{ .Values.storage.projection.hybridAsync.applyDebtMaxBytes | int64 | quote }}
  FIREWEED_HYBRID_ASYNC_APPLY_QUEUE_DEPTH_MAX: {{ .Values.storage.projection.hybridAsync.applyQueueDepthMax | int64 | quote }}
  FIREWEED_HYBRID_ASYNC_OLDEST_UNAPPLIED_MAX_MS: {{ .Values.storage.projection.hybridAsync.oldestUnappliedMaxMs | int64 | quote }}
  FIREWEED_HYBRID_ASYNC_APPLY_POISON_RETRY_THRESHOLD: {{ .Values.storage.projection.hybridAsync.applyPoisonRetryThreshold | int64 | quote }}
  {{- end }}
