replicaCount: 1

image:
  repository: ghcr.io/OWNER/fireweed-service
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: "fireweed"
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

config:
  listenAddr: 0.0.0.0:8080
  principalId: fireweed-service
  tenants: []

# Queues provisioned before the RESP listener becomes ready. An explicit list
# takes precedence over generation. With both disabled, the server preserves
# its built-in t1:q1 default.
bootstrap:
  queues: []
  generated:
    count: 0
    tenant: t1
    prefix: q

storage:
  lakebase:
    enabled: false
    endpointMode: pooler
    databaseName: databricks_postgres
    port: 5432
    sslMode: require
    auth:
      mode: native-password
      existingSecret: ""
      databricksHostKey: databricks-host
      databaseInstanceNameKey: database-instance-name
      clientIdKey: client-id
      clientSecretKey: client-secret
      tokenKey: token
      postgresUserKey: postgres-user
  shardCount:
    min: 1
    max: 1
  controlPlane:
    backend: inprocess
    postgres:
      existingSecret: ""
      databaseUrlKey: database-url
      heartbeatTtlMs: 5000
      leaseTtlMs: 15000
  # Structured storage axes (isomorphic to server StorageConfig / BackendSpec).
  # Public logs: memory | sqlite | postgres | filesystem | s3
  # Public projections: memory | sqlite | turso | postgres
  log:
    # Product default is filesystem (local/NAS object log).
    backend: filesystem
    # Filesystem root + S3 credential block for filesystem|s3 logs.
    objectLog:
      # Used when backend is filesystem (NAS-capable path ok).
      root: /var/lib/fireweed/projection/object-log
      # Used when backend is s3.
      s3:
        endpoint: ""
        bucket: ""
        region: us-east-1
        allowInsecureHttp: false
        credentials:
          existingSecret: ""
          accessKeyIdKey: access-key-id
          secretAccessKeyKey: secret-access-key
    # Used when backend is sqlite.
    sqlite:
      path: /var/lib/fireweed/projection/fireweed-log.db
    postgres:
      existingSecret: ""
      databaseUrlKey: database-url
  projection:
    # Product default is turso (TD-010 / ADR-016). Public: memory | sqlite | turso | postgres
    backend: turso
    sqlite:
      path: /var/lib/fireweed/projection/projection.db
    turso:
      # Pod-local path under storage.volume.mountPath (maps to FIREWEED_TURSO_PROJECTION_PATH).
      path: /var/lib/fireweed/projection/projection.turso
    postgres:
      existingSecret: ""
      databaseUrlKey: database-url
  volume:
    mountPath: /var/lib/fireweed/projection

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
