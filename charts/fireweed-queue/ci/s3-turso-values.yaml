# Fireweed Queue CI values: first-class s3 log × turso projection (public StorageConfig axes).
# Class A cell; S3 credentials via Secret. Pod-local Turso projection rebuilds from the S3 log.
storage:
  log:
    backend: s3
    objectLog:
      s3:
        endpoint: https://s3.example.com
        bucket: fireweed-matrix
        region: us-east-1
        allowInsecureHttp: false
        credentials:
          existingSecret: fireweed-objectlog-s3
          accessKeyIdKey: access-key-id
          secretAccessKeyKey: secret-access-key
  projection:
    backend: turso
    turso:
      path: /var/lib/fireweed/projection/projection.turso
persistence:
  enabled: false
image:
  tag: ci
replicaCount: 1
