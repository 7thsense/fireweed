apiVersion: v1
kind: Service
metadata:
  name: {{ include "pqueue.fullname" . }}
  labels:
    {{- include "pqueue.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: resp
      port: {{ .Values.service.port }}
      targetPort: resp
      protocol: TCP
  selector:
    {{- include "pqueue.selectorLabels" . | nindent 4 }}
