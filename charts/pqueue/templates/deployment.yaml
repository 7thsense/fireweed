apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pqueue.fullname" . }}
  labels:
    {{- include "pqueue.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pqueue.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pqueue.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pqueue.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pqueue
          image: "{{ .Values.image.repository }}:{{ include "pqueue.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: resp
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pqueue.fullname" . }}-config
          {{- if or (eq .Values.storage.log.backend "postgres") (eq .Values.storage.projection.backend "postgres") }}
          env:
            {{- if eq .Values.storage.log.backend "postgres" }}
            - name: PQUEUE_POSTGRES_LOG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.log.postgres.existingSecret | quote }}
                  key: {{ .Values.storage.log.postgres.databaseUrlKey | quote }}
            {{- end }}
            {{- if eq .Values.storage.projection.backend "postgres" }}
            - name: PQUEUE_POSTGRES_PROJECTION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.projection.postgres.existingSecret | quote }}
                  key: {{ .Values.storage.projection.postgres.databaseUrlKey | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: resp
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: resp
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (eq .Values.storage.log.backend "objectlog") (eq .Values.storage.projection.backend "sqlite") }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.storage.volume.mountPath | quote }}
          {{- end }}
      {{- if or (eq .Values.storage.log.backend "objectlog") (eq .Values.storage.projection.backend "sqlite") }}
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pqueue.storagePvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
