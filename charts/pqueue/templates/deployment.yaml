apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pqueue.fullname" . }}
  labels:
    {{- include "pqueue.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pqueue.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pqueue.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "pqueue.validateReplicaProfile" . }}
      serviceAccountName: {{ include "pqueue.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pqueue
          image: "{{ .Values.image.repository }}:{{ include "pqueue.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: resp
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pqueue.fullname" . }}-config
          {{- if or (gt (int .Values.replicaCount) 1) (and (eq .Values.storage.log.backend "objectlog") (eq .Values.storage.log.objectLog.store "s3")) (eq .Values.storage.log.backend "postgres") (eq .Values.storage.projection.backend "postgres") .Values.storage.lakebase.enabled (eq .Values.storage.controlPlane.backend "postgres") }}
          env:
            {{- if gt (int .Values.replicaCount) 1 }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PQUEUE_ADVERTISE_ADDR
              value: "$(POD_IP):{{ .Values.containerPort }}"
            {{- end }}
            {{- if and (eq .Values.storage.log.backend "objectlog") (eq .Values.storage.log.objectLog.store "s3") }}
            - name: PQUEUE_OBJECT_LOG_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.log.objectLog.s3.credentials.existingSecret | quote }}
                  key: {{ .Values.storage.log.objectLog.s3.credentials.accessKeyIdKey | quote }}
            - name: PQUEUE_OBJECT_LOG_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.log.objectLog.s3.credentials.existingSecret | quote }}
                  key: {{ .Values.storage.log.objectLog.s3.credentials.secretAccessKeyKey | quote }}
            {{- end }}
            {{- if eq .Values.storage.log.backend "postgres" }}
            {{- /* Self-sufficient libpq DSN (host/port/db + sslmode=require). The binary connects from
                   this DSN alone; it does not read the lakebase.* metadata. Preferred over PQUEUE_PG_URL. */}}
            - name: PQUEUE_POSTGRES_LOG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.log.postgres.existingSecret | quote }}
                  key: {{ .Values.storage.log.postgres.databaseUrlKey | quote }}
            {{- end }}
            {{- if eq .Values.storage.projection.backend "postgres" }}
            {{- /* Relational-projection DSN: consumed by the postgres/postgres combo
                   (ComposedBackend<PostgresLog, PostgresRelational, ..>, crates/pqueue-server/src/lib.rs).
                   The Lakebase profile uses projection=inmemory, so this never renders there. */}}
            - name: PQUEUE_POSTGRES_PROJECTION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.projection.postgres.existingSecret | quote }}
                  key: {{ .Values.storage.projection.postgres.databaseUrlKey | quote }}
            {{- end }}
            {{- if eq .Values.storage.controlPlane.backend "postgres" }}
            - name: PQUEUE_POSTGRES_CONTROL_PLANE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.controlPlane.postgres.existingSecret | quote }}
                  key: {{ .Values.storage.controlPlane.postgres.databaseUrlKey | quote }}
            {{- end }}
            {{- if .Values.storage.lakebase.enabled }}
            {{- if or (eq .Values.storage.lakebase.auth.mode "service-principal-oauth") (eq .Values.storage.lakebase.auth.mode "pat-oauth") }}
            - name: DATABRICKS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.lakebase.auth.existingSecret | quote }}
                  key: {{ .Values.storage.lakebase.auth.databricksHostKey | quote }}
            - name: PQUEUE_DATABRICKS_DATABASE_INSTANCE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.lakebase.auth.existingSecret | quote }}
                  key: {{ .Values.storage.lakebase.auth.databaseInstanceNameKey | quote }}
            {{- end }}
            {{- if eq .Values.storage.lakebase.auth.mode "service-principal-oauth" }}
            - name: DATABRICKS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.lakebase.auth.existingSecret | quote }}
                  key: {{ .Values.storage.lakebase.auth.clientIdKey | quote }}
            - name: DATABRICKS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.lakebase.auth.existingSecret | quote }}
                  key: {{ .Values.storage.lakebase.auth.clientSecretKey | quote }}
            {{- end }}
            {{- if eq .Values.storage.lakebase.auth.mode "pat-oauth" }}
            - name: DATABRICKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.lakebase.auth.existingSecret | quote }}
                  key: {{ .Values.storage.lakebase.auth.tokenKey | quote }}
            - name: PQUEUE_DATABRICKS_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.lakebase.auth.existingSecret | quote }}
                  key: {{ .Values.storage.lakebase.auth.postgresUserKey | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: resp
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: resp
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (eq .Values.storage.log.objectLog.store "local") (eq .Values.storage.projection.backend "sqlite") (eq .Values.storage.projection.backend "hybrid") (eq .Values.storage.projection.backend "hybrid-async") }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.storage.volume.mountPath | quote }}
          {{- end }}
      {{- if or (eq .Values.storage.log.objectLog.store "local") (eq .Values.storage.projection.backend "sqlite") (eq .Values.storage.projection.backend "hybrid") (eq .Values.storage.projection.backend "hybrid-async") }}
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pqueue.storagePvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
