apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pqueue.fullname" . }}
  labels:
    {{- include "pqueue.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pqueue.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pqueue.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pqueue.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pqueue
          image: "{{ .Values.image.repository }}:{{ include "pqueue.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pqueue.fullname" . }}-config
          env:
            - name: PQUEUE_POSTGRES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.postgres.existingSecret | quote }}
                  key: {{ .Values.backend.postgres.databaseUrlKey | quote }}
            {{- if eq .Values.backend.profile "object_log_sqlite_projection" }}
            - name: PQUEUE_OBJECT_LOG_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.objectLog.existingSecret | quote }}
                  key: {{ .Values.backend.objectLog.accessKeyIdKey | quote }}
            - name: PQUEUE_OBJECT_LOG_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.objectLog.existingSecret | quote }}
                  key: {{ .Values.backend.objectLog.secretAccessKeyKey | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if eq .Values.backend.profile "object_log_sqlite_projection" }}
          volumeMounts:
            - name: sqlite-projection
              mountPath: {{ .Values.backend.sqliteProjection.mountPath | quote }}
          {{- end }}
      {{- if eq .Values.backend.profile "object_log_sqlite_projection" }}
      volumes:
        - name: sqlite-projection
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pqueue.sqlitePvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
