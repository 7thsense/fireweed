apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pqueue.fullname" . }}-config
  labels:
    {{- include "pqueue.labels" . | nindent 4 }}
data:
  PQUEUE_LISTEN_ADDR: {{ .Values.config.listenAddr | quote }}
  PQUEUE_LOG_BACKEND: {{ .Values.storage.log.backend | quote }}
  PQUEUE_PROJECTION_BACKEND: {{ .Values.storage.projection.backend | quote }}
  PQUEUE_PRINCIPAL_ID: {{ .Values.config.principalId | quote }}
  PQUEUE_TENANTS: {{ join "," .Values.config.tenants | quote }}
  {{- if gt (len .Values.bootstrap.queues) 0 }}
  PQUEUE_BOOTSTRAP_QUEUES: {{ join "," .Values.bootstrap.queues | quote }}
  {{- else if gt (int .Values.bootstrap.generated.count) 0 }}
  PQUEUE_BOOTSTRAP_GENERATED_COUNT: {{ .Values.bootstrap.generated.count | quote }}
  PQUEUE_BOOTSTRAP_GENERATED_TENANT: {{ .Values.bootstrap.generated.tenant | quote }}
  PQUEUE_BOOTSTRAP_GENERATED_PREFIX: {{ .Values.bootstrap.generated.prefix | quote }}
  {{- end }}
  PQUEUE_SHARD_COUNT_MIN: {{ .Values.storage.shardCount.min | quote }}
  PQUEUE_SHARD_COUNT_MAX: {{ .Values.storage.shardCount.max | quote }}
  {{- if eq .Values.storage.log.backend "objectlog" }}
  PQUEUE_OBJECT_LOG_ROOT: {{ .Values.storage.log.objectLog.root | quote }}
  {{- end }}
  {{- if or (eq .Values.storage.projection.backend "sqlite") (eq .Values.storage.projection.backend "hybrid") (eq .Values.storage.projection.backend "hybrid-async") }}
  PQUEUE_SQLITE_PROJECTION_PATH: {{ .Values.storage.projection.sqlite.path | quote }}
  {{- end }}
  {{- if eq .Values.storage.projection.backend "hybrid-async" }}
  PQUEUE_HYBRID_ASYNC_APPLY_LAG_MAX_COMMANDS: {{ .Values.storage.projection.hybridAsync.applyLagMaxCommands | int64 | quote }}
  PQUEUE_HYBRID_ASYNC_APPLY_DEBT_MAX_BYTES: {{ .Values.storage.projection.hybridAsync.applyDebtMaxBytes | int64 | quote }}
  PQUEUE_HYBRID_ASYNC_APPLY_QUEUE_DEPTH_MAX: {{ .Values.storage.projection.hybridAsync.applyQueueDepthMax | int64 | quote }}
  PQUEUE_HYBRID_ASYNC_OLDEST_UNAPPLIED_MAX_MS: {{ .Values.storage.projection.hybridAsync.oldestUnappliedMaxMs | int64 | quote }}
  PQUEUE_HYBRID_ASYNC_APPLY_POISON_RETRY_THRESHOLD: {{ .Values.storage.projection.hybridAsync.applyPoisonRetryThreshold | int64 | quote }}
  {{- end }}
