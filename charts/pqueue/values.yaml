replicaCount: 1

image:
  repository: pqueue
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

config:
  listenAddr: 0.0.0.0:8080
  principalId: pqueue-service
  tenants: []

# Queues provisioned before the RESP listener becomes ready. An explicit list
# takes precedence over generation. With both disabled, the server preserves
# its built-in t1:q1 default.
bootstrap:
  queues: []
  generated:
    count: 0
    tenant: t1
    prefix: q

storage:
  lakebase:
    enabled: false
    endpointMode: pooler
    databaseName: databricks_postgres
    port: 5432
    sslMode: require
    auth:
      mode: native-password
      existingSecret: ""
      databricksHostKey: databricks-host
      databaseInstanceNameKey: database-instance-name
      clientIdKey: client-id
      clientSecretKey: client-secret
      tokenKey: token
      postgresUserKey: postgres-user
  shardCount:
    min: 1
    max: 1
  controlPlane:
    backend: inprocess
    postgres:
      existingSecret: ""
      databaseUrlKey: database-url
      heartbeatTtlMs: 5000
      leaseTtlMs: 15000
  log:
    backend: objectlog
    objectLog:
      store: local
      root: /var/lib/pqueue/projection/object-log
      s3:
        endpoint: ""
        bucket: ""
        region: us-east-1
        allowInsecureHttp: false
        credentials:
          existingSecret: ""
          accessKeyIdKey: access-key-id
          secretAccessKeyKey: secret-access-key
    postgres:
      existingSecret: ""
      databaseUrlKey: database-url
  projection:
    backend: inmemory
    sqlite:
      path: /var/lib/pqueue/projection/projection.db
    # Used only by feature-enabled images selecting the objectlog/turso profile.
    turso:
      path: /var/lib/pqueue/projection/projection.turso
    # Async-apply debt/backpressure/poison thresholds for the objectlog/hybrid-async profile. Rendered as
    # PQUEUE_HYBRID_ASYNC_* env only when projection.backend is "hybrid-async". Defaults mirror the server's
    # HybridAsyncThresholds::default(); every bound must be > 0 (a zero bound is instantly backpressured).
    hybridAsync:
      applyLagMaxCommands: 100000
      applyDebtMaxBytes: 536870912
      applyQueueDepthMax: 1024
      oldestUnappliedMaxMs: 60000
      applyPoisonRetryThreshold: 3
    postgres:
      existingSecret: ""
      databaseUrlKey: database-url
  volume:
    mountPath: /var/lib/pqueue/projection

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
