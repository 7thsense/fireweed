replicaCount: 1

image:
  repository: pqueue
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

config:
  listenAddr: 0.0.0.0:8080
  principalId: pqueue-service
  tenants: []

storage:
  lakebase:
    enabled: false
    endpointMode: pooler
    databaseName: databricks_postgres
    port: 5432
    sslMode: require
    auth:
      mode: native-password
      existingSecret: ""
      databricksHostKey: databricks-host
      databaseInstanceNameKey: database-instance-name
      clientIdKey: client-id
      clientSecretKey: client-secret
      tokenKey: token
      postgresUserKey: postgres-user
  shardCount:
    min: 1
    max: 1
  log:
    backend: objectlog
    objectLog:
      root: /var/lib/pqueue/projection/object-log
    postgres:
      existingSecret: ""
      databaseUrlKey: database-url
  projection:
    backend: inmemory
    sqlite:
      path: /var/lib/pqueue/projection/projection.db
    postgres:
      existingSecret: ""
      databaseUrlKey: database-url
  volume:
    mountPath: /var/lib/pqueue/projection

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
