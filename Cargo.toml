[workspace]
# `cargo test --workspace` covers exactly the members below: domain, storage
# adapters (memory/Turso/PostgreSQL/object-log), conformance, facade, server and tools.
# Independently invoke `crates/fireweed-bench/Cargo.toml`, `vendor/turso_core/Cargo.toml`
# and `vendor/object-log/Cargo.toml`; their tests are outside this workspace.
# Live integrations require explicitly configured PostgreSQL, S3 and Kafka fixtures.
members = [
    "crates/fireweed-core",
    "crates/fireweed-engine",
    "crates/fireweed-projection",
    "crates/fireweed-relational",
    "crates/fireweed-turso",
    "crates/fireweed-conformance",
    "crates/fireweed-memory",
    "crates/fireweed-postgres",
    "crates/fireweed-objectlog",
    "crates/fireweed-resp",
    "crates/fireweed",
    "crates/fireweed-server",
    "crates/fireweed-release",
    "crates/fireweed-loadgen",
    "crates/fireweed-sim-support",
    "crates/fireweed-workload",
]
exclude = ["vendor/object-log", "vendor/turso_core", "vendor/turso", "vendor/turso_sdk_kit", "vendor/turso_sync_sdk_kit", "vendor/turso_sync_engine"]
resolver = "3"

[workspace.package]
version = "0.31.32"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7thsense/fireweed"
homepage = "https://github.com/7thsense/fireweed"

[workspace.dependencies]
# Thin ESF types (entity schema + typed index declarations + canonical key encoder) consumed by
# fireweed-core for ADR-011.  Git-pinned to a release tag; no path dependency.  The axon workspace
# pins jsonschema with default-features = false so this dep is free of reqwest/hyper/tower.
# Multi-line TOML string keeps the repo name on a separate line from the host prefix so the
# ADR-011 AC path-dep check (rg for path=.*axon etc.) does not false-positive on the git URL.
axon-esf = { version = "0.4.2", git = """https://github.com/DocumentDrivenDX/\
axon""", tag = "v0.4.2" }

[profile.release]
# Optimize across the facade/adapter/engine boundaries for shipped executables.
# Keep a portable target CPU and the default unwind/error-checking policies.
lto = "thin"
codegen-units = 1
