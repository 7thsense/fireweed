[workspace]
# The hexagonal architecture in full (plan v4): the domain (core + engine + projection), the shared
# conformance harness, the three driven adapters (memory/sqlite/objectlog), and the two driving faces
# (RESP front + library facade) plus the composition root. The legacy HTTP-service/Kafka/storage-trait
# crates were deleted in Phase 6; the postgres adapter is deferred and will be (re)added fresh to the
# engine ports when a database is provisioned. No crate is excluded, so `cargo test` covers everything.
members = [
    "crates/pqueue-core",
    "crates/pqueue-engine",
    "crates/pqueue-projection",
    "crates/pqueue-conformance",
    "crates/pqueue-memory",
    "crates/pqueue-sqlite",
    "crates/pqueue-objectlog",
    "crates/pqueue-resp",
    "crates/pqueue",
    "crates/pqueue-server",
]
resolver = "3"

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
