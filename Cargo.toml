[workspace]
# The hexagonal architecture in full (plan v4): the domain (core + engine + projection), the shared
# conformance harness, the four driven adapters (memory/sqlite/postgres/objectlog), and the two driving
# faces (RESP front + library facade) plus the composition root. The removed HTTP-service/Kafka/storage-
# trait crates were deleted in Phase 6; the postgres adapter was rebuilt fresh to the engine ports
# (OWED-resolution Chunk 4) via the durable-adapter template. `cargo test --workspace` covers exactly
# the members below. It does not cover the independently routed
# `crates/fireweed-bench/Cargo.toml` or `tools/fireweed-turso-compat-probe/Cargo.toml` workspaces;
# their harnesses must be listed and invoked separately. PostgreSQL conformance is env-gated on
# FIREWEED_PG_TEST_URL and remains registered remediation debt until its LOUD-skip paths are closed.
members = [
    "crates/fireweed-core",
    "crates/fireweed-engine",
    "crates/fireweed-projection",
    "crates/fireweed-relational",
    "crates/fireweed-turso",
    "crates/fireweed-conformance",
    "crates/fireweed-memory",
    "crates/fireweed-sqlite",
    "crates/fireweed-postgres",
    "crates/fireweed-objectlog",
    "crates/fireweed-resp",
    "crates/fireweed",
    "crates/fireweed-server",
    "crates/fireweed-release",
    "crates/fireweed-loadgen",
    "crates/fireweed-sim-support",
]
resolver = "3"

[workspace.package]
version = "0.31.16"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7thsense/fireweed"
homepage = "https://github.com/7thsense/fireweed"

[workspace.dependencies]
# Thin ESF types (entity schema + typed index declarations + canonical key encoder) consumed by
# fireweed-core for ADR-011.  Git-pinned to a release tag; no path dependency.  The axon workspace
# pins jsonschema with default-features = false so this dep is free of reqwest/hyper/tower.
# Multi-line TOML string keeps the repo name on a separate line from the host prefix so the
# ADR-011 AC path-dep check (rg for path=.*axon etc.) does not false-positive on the git URL.
axon-esf = { version = "0.3.2", git = """https://github.com/DocumentDrivenDX/\
axon""", tag = "v0.3.2" }
