[workspace]
# The hexagonal architecture in full (plan v4): the domain (core + engine + projection), the shared
# conformance harness, the four driven adapters (memory/sqlite/postgres/objectlog), and the two driving
# faces (RESP front + library facade) plus the composition root. The legacy HTTP-service/Kafka/storage-
# trait crates were deleted in Phase 6; the postgres adapter was rebuilt fresh to the engine ports
# (OWED-resolution Chunk 4) via the durable-adapter template. No crate is excluded, so `cargo test`
# covers everything; postgres conformance is env-gated on PQUEUE_PG_TEST_URL (LOUD skip without a DB).
members = [
    "crates/pqueue-core",
    "crates/pqueue-engine",
    "crates/pqueue-projection",
    "crates/pqueue-conformance",
    "crates/pqueue-memory",
    "crates/pqueue-sqlite",
    "crates/pqueue-postgres",
    "crates/pqueue-objectlog",
    "crates/pqueue-resp",
    "crates/pqueue",
    "crates/pqueue-server",
    "crates/pqueue-release",
    "crates/pqueue-loadgen",
]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Thin ESF types (entity schema + typed index declarations + canonical key encoder) consumed by
# pqueue-core for ADR-011.  Git-pinned to a release tag; no path dependency.  The axon workspace
# pins jsonschema with default-features = false so this dep is free of reqwest/hyper/tower.
# Multi-line TOML string keeps the repo name on a separate line from the host prefix so the
# ADR-011 AC path-dep check (rg for path=.*axon etc.) does not false-positive on the git URL.
axon-esf = { git = """https://github.com/DocumentDrivenDX/\
axon""", tag = "v0.3.2" }

# SECURITY: kafka-protocol upstream (all versions 0.15-0.17) pre-allocates
# `Vec::with_capacity(n)` from an attacker-controlled Array/CompactArray count
# BEFORE reading any element — a remotely-triggerable OOM DoS reachable through
# the embedded fjord broker's Kafka wire surface. heimq authored a bounded fix,
# but `[patch]` only applies from the top-level workspace root, so heimq's patch
# does NOT propagate to pqueue. Apply it here so pqueue's build is actually bounded.
# TODO(release): rebase this bound onto kafka-protocol >=0.17 to also drop the
# unmaintained `paste` dep (RUSTSEC-2024-0436), then bump heimq/fjord revs.
[patch.crates-io]
kafka-protocol = { git = "https://github.com/easel/kafka-protocol-rs", branch = "heimq-bound-array-capacity" }
