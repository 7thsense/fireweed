services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pqueue
      POSTGRES_USER: pqueue
      POSTGRES_PASSWORD: pqueue
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqueue -d pqueue"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - pqueue-postgres-data:/var/lib/postgresql/data

volumes:
  pqueue-postgres-data:
