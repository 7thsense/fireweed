services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fireweed
      POSTGRES_USER: fireweed
      POSTGRES_PASSWORD: fireweed
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireweed -d fireweed"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - fireweed-postgres-data:/var/lib/postgresql/data

volumes:
  fireweed-postgres-data:
