[package]
name = "fireweed-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Domain crate: ports + execution. Depends ONLY on fireweed-core (hexagonal: domain
# depends on nothing outward). No I/O dependencies.
[dependencies]
fireweed-core = { path = "../fireweed-core" }
axon-esf.workspace = true
bytes = { version = "1", features = ["serde"] }
sha2 = "0.11"
getrandom = "0.3"
# Command/log types derive Serialize/Deserialize so a durable backend can persist the command log.
serde = { version = "1", features = ["derive"] }
# Deterministic body fingerprint for the composed backend's request-id idempotency (ADR-012). Pure
# serialization, no I/O — mirrors the monolithic memory/sqlite backends.
serde_json = "1"

[dev-dependencies]
futures = "0.3"
fireweed-conformance = { path = "../fireweed-conformance" }
fireweed-projection = { path = "../fireweed-projection" }
serde_json = "1"
