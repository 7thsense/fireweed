[package]
name = "pqueue-kafka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-storage = { path = "../pqueue-storage" }
# Pinned to a stable heimq rev rather than a path into the sibling repo, so pqueue
# builds reproducibly and does not absorb heimq's working tree. heimq-wire is
# heimq's governed WIRE-001 scaffolding; tracking it by rev keeps pqueue on the
# hardened copy. See the heimq bead: refactor heimq's own server.rs onto heimq-wire.
heimq-wire = { git = "https://github.com/easel/heimq", rev = "da4b87fcbedd321bcd49b5f0c38a4af579785533" }

# Kafka wire protocol
kafka-protocol = "0.15"
async-trait = "0.1"
bytes = "1.10"
tokio = { version = "1.44", features = ["net", "io-util", "rt-multi-thread", "sync", "macros"] }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.44", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "wire_produce_conformance"
path = "tests/wire_produce_conformance.rs"

[[test]]
name = "wire_unit_tests"
path = "tests/wire_unit_tests.rs"

[[test]]
name = "wire_persistence_tests"
path = "tests/wire_persistence_tests.rs"
