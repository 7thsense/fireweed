[package]
name = "fireweed-turso"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Opt-in local embedded Turso Database engine. Remote/cloud sync is intentionally not part of this slice.
local = ["dep:tokio", "dep:turso"]

[dependencies]
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
fireweed-relational = { path = "../fireweed-relational" }
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync"], optional = true }
# Turso's official Rust-native embedded client. Defaults pull in FTS and mimalloc; neither is needed here.
turso = { version = "=0.7.0", default-features = false, optional = true }

[dev-dependencies]
fireweed-conformance = { path = "../fireweed-conformance" }
fireweed-projection = { path = "../fireweed-projection" }
fireweed-sqlite = { path = "../fireweed-sqlite" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[[test]]
name = "local_relational"
path = "tests/local_relational.rs"
required-features = ["local"]

[[test]]
name = "async_reclaim_selection"
path = "tests/async_reclaim_selection.rs"
required-features = ["local"]

[[test]]
name = "differential"
path = "tests/differential.rs"
required-features = ["local"]

[[test]]
name = "recovery"
path = "tests/recovery.rs"
required-features = ["local"]

[[test]]
name = "concurrency"
path = "tests/concurrency.rs"
required-features = ["local"]

[[test]]
name = "cancellation"
path = "tests/cancellation.rs"
required-features = ["local"]
