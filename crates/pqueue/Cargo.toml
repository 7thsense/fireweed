[package]
name = "pqueue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# The ergonomic Rust LIBRARY interface — one of the two faces of the engine (the other is RESP). A thin
# composition over the engine ports: push/upsert/claim/ack/nack/peek/metrics. Depends on the domain
# (engine + core) only; a concrete backend + clock are injected (hexagonal).
[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-engine = { path = "../pqueue-engine" }
bytes = "1"
# Adapters are OPTIONAL deps, activated per feature. The published library is a thin composition root
# that builds the chosen backend internally (ADR-009 §4a / B3) so a client never names a concrete backend
# — `Pqueue::open_*` is the construction path. This is the deliberate composition-root dependency inversion.
pqueue-memory = { path = "../pqueue-memory", optional = true }
pqueue-sqlite = { path = "../pqueue-sqlite", optional = true }
pqueue-objectlog = { path = "../pqueue-objectlog", optional = true }

[features]
# Default pulls every adapter so `cargo build`/`cargo test` behave as before; a consumer who wants only
# one backend uses e.g. `--no-default-features --features sqlite` and never compiles the others.
default = ["memory", "sqlite", "objectlog"]
memory = ["dep:pqueue-memory"]
sqlite = ["dep:pqueue-sqlite"]
objectlog = ["dep:pqueue-objectlog"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# product_validation_tests (AC-E2E-* product workflows) emit verification-ledger rows.
pqueue-release = { path = "../pqueue-release" }
serde_json = "1"
