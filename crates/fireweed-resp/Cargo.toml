[package]
name = "fireweed-resp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Driving adapter: RESP/Redis-Streams wire front. Depends on the domain (engine) only; a concrete
# backend is injected by the composition root / tests (hexagonal).
[dependencies]
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "macros"] }
# CancellationToken to signal the serve loop to stop accepting and drain (handlers are owned by a
# tokio::task::JoinSet, so the drain is hard-bounded — see serve_with_shutdown).
tokio-util = { version = "0.7" }

[dev-dependencies]
fireweed-memory = { path = "../fireweed-memory" }
fireweed-sqlite = { path = "../fireweed-sqlite" }
redis = { version = "1", features = ["tokio-comp", "cluster-async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
