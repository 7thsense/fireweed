[package]
name = "pqueue-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# Domain crate: ports + execution. Depends ONLY on pqueue-core (hexagonal: domain
# depends on nothing outward). No I/O dependencies.
[dependencies]
pqueue-core = { path = "../pqueue-core" }
bytes = { version = "1", features = ["serde"] }
sha2 = "0.11"
# Command/log types derive Serialize/Deserialize so a durable backend can persist the command log.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
