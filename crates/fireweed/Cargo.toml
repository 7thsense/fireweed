[package]
name = "fireweed"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fireweed"
description = "Mutable-priority leased work queues for embedded and distributed Rust systems"
readme = "../../README.md"
keywords = ["queue", "priority-queue", "job-queue", "scheduler", "workflow"]
categories = ["asynchronous", "data-structures", "database-implementations"]
include = [
    "src/**",
    "examples/**",
    "Cargo.toml",
    "../../README.md",
    "../../LICENSE-MIT",
    "../../LICENSE-APACHE",
]

[lib]
path = "src/lib.rs"

# `queue::Queue` is the public library interface. Adapters are optional dependencies activated per
# feature; the crate builds the chosen backend internally so a client never names a concrete backend.
[dependencies]
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
fireweed-queue-spool = { path = "../fireweed-queue-spool", optional = true }
bytes = "1"
serde_json = "1"
futures = "0.3"
sha2 = "0.11"
fireweed-objectlog = { path = "../fireweed-objectlog", optional = true }
fireweed-postgres = { path = "../fireweed-postgres", optional = true }
fireweed-turso = { path = "../fireweed-turso", optional = true }
# Only to parse a PostgreSQL URL before any I/O in `Queue::s3_turso`.
tokio-postgres = { version = "0.7", optional = true }
# Optional: pulled by `objectlog` / `postgres` / `turso`. Workers need `rt` + I/O drivers for LogEngine.
tokio = { version = "1", features = ["rt", "time", "fs", "io-util", "net", "sync"], optional = true }

# Lease deadlines are measured on CLOCK_BOOTTIME, which `Instant` is not.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["time"] }

[features]
# `Queue::s3_turso` and `Queue::ephemeral_disk` (default); `postgres` adds `Queue::postgres`.
default = ["s3-turso"]
# objectlog enables the shared Tokio reactor used by LogEngine I/O.
objectlog = ["dep:fireweed-queue-spool", "dep:fireweed-objectlog", "dep:tokio"]
postgres = ["dep:fireweed-postgres", "dep:tokio"]
# Production queue storage: S3 object log, local Turso projection cache and the PostgreSQL control plane
# (`queue::Queue::s3_turso`). It does not enable `postgres`, which is the PostgreSQL reference store.
s3-turso = ["objectlog", "turso", "dep:fireweed-postgres", "dep:tokio-postgres"]
# Local embedded Turso ordinary-WAL projection.
turso = ["dep:fireweed-turso", "fireweed-turso/local", "dep:tokio"]

[dev-dependencies]
async-trait = "0.1"
fireweed-conformance = { path = "../fireweed-conformance" }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "time", "sync"] }
serde_json = "1"
# The counting S3 proxy in the queue pipeline tests (already in the lockfile via the AWS SDK).
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[[test]]
name = "simple_queue_postgres"
path = "tests/simple_queue_postgres.rs"
required-features = ["postgres"]

[[example]]
name = "queue_lifecycle"
path = "examples/queue_lifecycle.rs"
required-features = ["s3-turso"]
