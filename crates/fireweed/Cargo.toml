[package]
name = "fireweed"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fireweed"
description = "Mutable-priority leased work queues for embedded and distributed Rust systems"
readme = "../../README.md"
keywords = ["queue", "priority-queue", "job-queue", "scheduler", "workflow"]
categories = ["asynchronous", "data-structures", "database-implementations"]
include = [
    "src/**",
    "examples/**",
    "Cargo.toml",
    "../../README.md",
    "../../LICENSE-MIT",
    "../../LICENSE-APACHE",
]

[lib]
path = "src/lib.rs"

# The ergonomic Rust LIBRARY interface — one of the two faces of the engine (the other is RESP). A thin
# composition over the engine ports: push/upsert/claim/ack/nack/peek/metrics. Depends on the domain
# (engine + core) only; a concrete backend + clock are injected (hexagonal).
[dependencies]
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
bytes = "1"
serde_json = "1"
futures = "0.3"
sha2 = "0.11"
# Adapters are OPTIONAL deps, activated per feature. The published library is a thin composition root
# that builds the chosen backend internally (ADR-009 §4a / B3) so a client never names a concrete backend
# — the `open_*` functions are the construction path. This is the deliberate composition-root dependency inversion.
fireweed-memory = { path = "../fireweed-memory", optional = true }
fireweed-objectlog = { path = "../fireweed-objectlog", optional = true }
fireweed-postgres = { path = "../fireweed-postgres", optional = true }
fireweed-turso = { path = "../fireweed-turso", optional = true }
# Composition-root only: Class B MemoryLog pairings and object-log × memory projection assembly.
fireweed-projection = { path = "../fireweed-projection", optional = true }
# Optional: pulled by `objectlog` / `postgres` / `turso`. Workers need `rt` + I/O drivers for LogEngine.
tokio = { version = "1", features = ["rt", "time", "fs", "io-util", "net", "sync"], optional = true }

[features]
# Default pulls the embeddable adapters so `cargo build`/`cargo test` behave as before; a consumer who
# wants only one backend uses e.g. `--no-default-features --features turso`. `postgres` is OPT-IN (it pulls
# the postgres client) and is the multi-instance backend (`open_postgres` / `open_postgres_coordinated`).
# `turso` is default-on: Turso is the public default projection (ADR-016 / TD-010).
# rusqlite `sqlite` log/projection is retired; use filesystem log and turso projection.
default = ["memory", "objectlog", "turso"]
memory = ["dep:fireweed-memory", "dep:fireweed-projection"]
# objectlog enables the shared Tokio reactor used by LogEngine I/O.
objectlog = ["dep:fireweed-objectlog", "dep:fireweed-projection", "dep:tokio"]
postgres = ["dep:fireweed-postgres", "dep:tokio"]
# Local embedded Turso 0.7 ordinary-WAL projection (public default projection axis).
turso = ["dep:fireweed-turso", "fireweed-turso/local", "dep:tokio", "dep:fireweed-projection"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "time", "sync"] }
# product_validation_tests (AC-E2E-* product workflows) emit verification-ledger rows.
fireweed-release = { path = "../fireweed-release" }
serde_json = "1"
# The postgres-constructor smoke test drives the sync postgres client via a non-tokio executor.
postgres = "0.19"

