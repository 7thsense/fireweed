[package]
name = "fireweed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fireweed"
description = "Mutable-priority leased work queues for embedded and distributed Rust systems"
readme = "../../README.md"
keywords = ["queue", "priority-queue", "job-queue", "scheduler", "workflow"]
categories = ["asynchronous", "data-structures", "database-implementations"]
include = [
    "src/**",
    "examples/**",
    "Cargo.toml",
    "../../README.md",
    "../../LICENSE-MIT",
    "../../LICENSE-APACHE",
]

[lib]
path = "src/lib.rs"

# The ergonomic Rust LIBRARY interface — one of the two faces of the engine (the other is RESP). A thin
# composition over the engine ports: push/upsert/claim/ack/nack/peek/metrics. Depends on the domain
# (engine + core) only; a concrete backend + clock are injected (hexagonal).
[dependencies]
axon-esf.workspace = true
fireweed-core = { version = "0.20.0", path = "../fireweed-core" }
fireweed-engine = { version = "0.20.0", path = "../fireweed-engine" }
bytes = "1"
serde_json = "1"
futures = "0.3"
sha2 = "0.11"
# Adapters are OPTIONAL deps, activated per feature. The published library is a thin composition root
# that builds the chosen backend internally (ADR-009 §4a / B3) so a client never names a concrete backend
# — `Pqueue::open_*` is the construction path. This is the deliberate composition-root dependency inversion.
fireweed-memory = { version = "0.20.0", path = "../fireweed-memory", optional = true }
fireweed-sqlite = { version = "0.20.0", path = "../fireweed-sqlite", optional = true }
fireweed-objectlog = { version = "0.20.0", path = "../fireweed-objectlog", optional = true }
fireweed-postgres = { version = "0.20.0", path = "../fireweed-postgres", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
# Default pulls the embeddable adapters so `cargo build`/`cargo test` behave as before; a consumer who
# wants only one backend uses e.g. `--no-default-features --features sqlite`. `postgres` is OPT-IN (it pulls
# the postgres client) and is the multi-instance backend (`open_postgres` / `open_postgres_coordinated`).
default = ["memory", "sqlite", "objectlog"]
memory = ["dep:fireweed-memory"]
sqlite = ["dep:fireweed-sqlite"]
objectlog = ["dep:fireweed-objectlog"]
postgres = ["dep:fireweed-postgres", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
# product_validation_tests (AC-E2E-* product workflows) emit verification-ledger rows.
fireweed-release = { version = "0.20.0", path = "../fireweed-release" }
serde_json = "1"
# The postgres-constructor smoke test drives the sync postgres client via a non-tokio executor.
postgres = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
