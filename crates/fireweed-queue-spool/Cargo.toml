[package]
name = "fireweed-queue-spool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
test-support = []

# Shared owned-operation lifecycle and physical scratch. The domain stays I/O-free.
[dependencies]
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
tempfile = "3.27"
postcard = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
