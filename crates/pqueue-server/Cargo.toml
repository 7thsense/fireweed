[package]
name = "pqueue-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pqueue-service"
path = "src/bin/pqueue-service.rs"

# Composition root: the ONE place that names concrete adapters. Wires a chosen backend
# (memory/sqlite/objectlog) + a system clock to the RESP front (`pqueue-resp`) and runs a background
# ReclaimDriver task so leases reclaim without client traffic (TD-007 §3). Everything else depends only
# inward; this depends on all the adapters.
[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-engine = { path = "../pqueue-engine" }
pqueue-resp = { path = "../pqueue-resp" }
pqueue-memory = { path = "../pqueue-memory" }
pqueue-sqlite = { path = "../pqueue-sqlite" }
pqueue-turso = { path = "../pqueue-turso", optional = true }
pqueue-objectlog = { path = "../pqueue-objectlog" }
pqueue-projection = { path = "../pqueue-projection" }
fjord = { git = "https://github.com/7thsense/fjord.git", tag = "v0.1.3", package = "fjord-broker" }
heimq = { git = "https://github.com/easel/heimq", tag = "v0.1.2" }
heimq-broker = { git = "https://github.com/easel/heimq", tag = "v0.1.2" }
# Pure-Rust Kafka v2 record-batch codec, imported as `heimq_protocol`: heimq's VENDORED fork of
# kafka-protocol 0.15.1 that bounds Array/CompactArray decode allocation (fixes the OOM DoS). Used to
# encode change records for the in-process log append path, matching the version the embedded fjord/heimq
# broker decodes with (`RecordBatchView::from_bytes`). No upstream kafka-protocol, no C/cmake/libcurl.
heimq-protocol = { git = "https://github.com/easel/heimq", tag = "v0.1.2", default-features = false }
# OPTIONAL external-Kafka deployment seam: a pure-Rust Kafka producer used only when the operator opts a
# deployment into publishing change records to an EXTERNAL Kafka instead of the in-process embedded fjord
# surface. Default-off; `default-features = false` keeps the C compression codecs (lz4/zstd) out.
rskafka = { version = "0.6", default-features = false, optional = true }
# rskafka records carry a chrono timestamp; only compiled behind `external-kafka`. Pure Rust.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
# The shared production queue-control-plane implementation. This dependency is unconditional because an
# object-log deployment can use Postgres for ownership even when neither its log nor projection is Postgres.
# Postgres log/projection selection remains gated by the `postgres` feature below.
pqueue-postgres = { path = "../pqueue-postgres" }
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync"] }
# CancellationToken to signal a graceful drain to the RESP serve loop on shutdown.
tokio-util = { version = "0.7" }
futures = "0.3"
[features]
default = ["env-config"]
# The OPTIONAL env-var populator: `Config::from_env(&BTreeMap)` + `ConfigError`, the single place that maps
# the documented `PQUEUE_*`/`DATABRICKS_*` env NAMES onto the typed `Config`. Default-on so the `pqueue-service`
# bin builds; a pure-library embedder can `default-features = false` to drop ALL env-name knowledge — the core
# library API (`Config` + `start`/`start_with_ownership`) carries no env dependency either way (the populator
# is pure over a caller-supplied map; the only process-env read, `std::env::vars()`, lives in the bin's `main`).
env-config = []
# Wire `Backend::PostgresNative` (the sync postgres adapter behind the blocking-safe wrapper).
postgres = []
# Connect the postgres adapter over native-tls (Lakebase / cloud postgres). Implies `postgres`.
tls = ["postgres", "pqueue-postgres/tls"]
# Opt-in external-Kafka change-record sink over the pure-Rust `rskafka` producer (ADR-014 invariant #4:
# the swappable-at-the-seam external option). Default-off: the in-process embedded fjord surface is the
# default. No C Kafka client: the external seam is pure Rust.
external-kafka = ["dep:rskafka", "dep:chrono"]
# Opt-in native-async Turso derived projection for the object-log profile. The dependency's local
# feature is intentionally selected here; remote/sync/MVCC Turso modes remain out of scope.
turso-projection = ["dep:pqueue-turso", "pqueue-turso/local"]

[dev-dependencies]
pqueue = { path = "../pqueue", default-features = false }
pqueue-core = { path = "../pqueue-core" }
pqueue-conformance = { path = "../pqueue-conformance" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "test-util"] }
redis = { version = "1", features = ["tokio-comp"] }
postgres = "0.19"
# The TP-002 E3 live object-log ack/recovery benchmark harness emits + strict-validates release-ledger rows.
pqueue-release = { path = "../pqueue-release" }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# The hybrid attribution harness frames command envelopes with the same wire codec the object-log write
# path uses (segmented.rs), so the measured serialize phase reflects real cost.
# Pure-Rust Kafka CONSUMER for the end-to-end contract test: it consumes change records back over the
# embedded broker's real TCP Kafka fetch surface (verifying HeimqServer serves the in-process appends, not
# just the stored bytes). Dev-only so it always runs under default `cargo test`; no C dependency.
rskafka = { version = "0.6", default-features = false }

[[test]]
name = "performance_object_log_e3_live_tests"
path = "tests/performance_object_log_e3_live_tests.rs"

[[test]]
name = "performance_single_deployment_baseline_tests"
path = "tests/performance_single_deployment_baseline_tests.rs"
required-features = ["postgres"]
