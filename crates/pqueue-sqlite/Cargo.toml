[package]
name = "pqueue-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-storage = { path = "../pqueue-storage" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.44", features = ["rt", "macros"] }

[[test]]
name = "sqlite_projection_tests"
path = "tests/sqlite_projection_tests.rs"

[[test]]
name = "sqlite_log_tests"
path = "tests/sqlite_log_tests.rs"

[[test]]
name = "sqlite_projection_store_tests"
path = "tests/sqlite_projection_store_tests.rs"

[[test]]
name = "sqlite_control_plane_tests"
path = "tests/sqlite_control_plane_tests.rs"

[[test]]
name = "sqlite_backend_tests"
path = "tests/sqlite_backend_tests.rs"

[[test]]
name = "shared_conformance"
path = "tests/shared_conformance.rs"

[[test]]
name = "embedder_delivery_conformance"
path = "tests/embedder_delivery_conformance.rs"
