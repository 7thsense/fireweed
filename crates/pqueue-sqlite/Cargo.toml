[package]
name = "pqueue-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# Driven adapter: sqlite. Durable command LOG in sqlite (rusqlite); the priority-ordered projection is
# the shared `pqueue-projection` materialization, rebuilt from the log. Depends on the domain
# (engine/core) + the shared projection — the correct hexagonal direction.
[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-engine = { path = "../pqueue-engine" }
pqueue-projection = { path = "../pqueue-projection" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
serde_json = "1"
bytes = "1"
# Lease-token hashing for the relational projection (hash-only at rest; TD-004 §security / TD-002 parity).
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# Runs the shared backend-conformance suite against the sqlite backend.
pqueue-conformance = { path = "../pqueue-conformance" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

# BQ-11a/b/c: the relational projection family's core conformance + lifecycle round-trip + group/retention.
[[test]]
name = "relational_conformance"
path = "tests/relational_conformance.rs"

# BQ-11d: the relational-reconnect conformance class against the DB-authoritative relational backend.
[[test]]
name = "relational_reconnect"
path = "tests/relational_reconnect.rs"
