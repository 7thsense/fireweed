[package]
name = "fireweed-objectlog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Object-log product backends over crates.io object-log LogEngine.
[dependencies]
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
fireweed-projection = { path = "../fireweed-projection" }
fireweed-sqlite = { path = "../fireweed-sqlite" }
# crates.io object-log (program A substrate). Native async LogEngine.
object-log = { version = "0.3.1", git = "https://github.com/7thsense/object-log.git", tag = "v0.3.1", features = ["s3"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
fireweed-conformance = { path = "../fireweed-conformance" }
fireweed-release = { path = "../fireweed-release" }
fireweed-engine = { path = "../fireweed-engine" }
fireweed-sqlite = { path = "../fireweed-sqlite" }
fireweed-sim-support = { path = "../fireweed-sim-support" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

[[test]]
name = "composed_reconnect"
path = "tests/composed_reconnect.rs"
