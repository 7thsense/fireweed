[package]
name = "fireweed-objectlog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Object-log product backends over crates.io object-log LogEngine.
[dependencies]
async-trait = "0.1"
futures = "0.3"
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
fireweed-projection = { path = "../fireweed-projection" }
# Vendored log implementation, including Fireweed fixes, for every consuming workspace.
object-log = { version = "0.3.4", git = "https://github.com/7thsense/object-log.git", tag = "v0.3.4", features = ["s3"] }
# Create-only PutObject (If-None-Match: *) for queue-definition authority; object-log
# BlobStore is overwrite-only put, so Fireweed owns the conditional create path.
aws-sdk-s3 = { version = "1.122", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
fireweed-conformance = { path = "../fireweed-conformance" }
fireweed-engine = { path = "../fireweed-engine" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

[[test]]
name = "composed_reconnect"
path = "tests/composed_reconnect.rs"
