[package]
name = "fireweed-objectlog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Driven adapter (EVENTUAL-APPLY durability class): the command log is a set of immutable per-command
# objects on an object store (a local filesystem stands in for S3 here — no server). The projection is
# the shared `fireweed-projection` materialization, rebuilt from the object log. Upsert (atomic XDEL+XADD)
# is NOT offered on this class (Invariant 2) and returns `-ERR fireweed unavailable`.
[dependencies]
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
fireweed-projection = { path = "../fireweed-projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures = "0.3"
# SigV4 signing for the minimal hand-rolled S3 client (`segmented::S3BlobStore`). Already in-tree for the
# relational projection crates; HMAC-SHA256 / canonical-request / HTTP/1.1 framing are hand-rolled on top so
# no async HTTP/S3 SDK (reqwest/hyper/object_store) is pulled — keeping the adapter's dependency surface lean.
sha2 = "0.11"
getrandom = "0.3"
# Castagnoli CRC32C protects v3 records and complete segment frames. The
# cryptographic object identity remains the existing SHA-256 digest.
crc32c = "0.6"
# Production S3 endpoints are HTTPS. The hand-rolled SigV4 client keeps its
# dependency-light HTTP framing but uses rustls + the public WebPKI roots for
# the transport instead of silently downgrading shared object-log traffic.
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
fireweed-conformance = { path = "../fireweed-conformance" }
fireweed-release = { path = "../fireweed-release" }
fireweed-engine = { path = "../fireweed-engine" }
fireweed-sqlite = { path = "../fireweed-sqlite" }
fireweed-turso = { path = "../fireweed-turso", features = ["local"] }
fireweed-sim-support = { path = "../fireweed-sim-support" }

[[test]]
name = "deterministic_storage_simulation"
path = "tests/deterministic_storage_simulation.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

[[test]]
name = "reconnect_smoke"
path = "tests/reconnect_smoke.rs"

[[test]]
name = "object_log_commit_recovery_tests"
path = "tests/object_log_commit_recovery_tests.rs"

[[test]]
name = "segmented_s3_substrate_tests"
path = "tests/segmented_s3_substrate_tests.rs"

[[test]]
name = "composed_sqlite_projection"
path = "tests/composed_sqlite_projection.rs"

[[test]]
name = "async_turso_commit"
path = "tests/async_turso_commit.rs"
