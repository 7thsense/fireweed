[package]
name = "pqueue-objectlog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# Driven adapter (EVENTUAL-APPLY durability class): the command log is a set of immutable per-command
# objects on an object store (a local filesystem stands in for S3 here — no server). The projection is
# the shared `pqueue-projection` materialization, rebuilt from the object log. Upsert (atomic XDEL+XADD)
# is NOT offered on this class (Invariant 2) and returns `-ERR pqueue unavailable`.
[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-engine = { path = "../pqueue-engine" }
pqueue-projection = { path = "../pqueue-projection" }
serde = "1"
serde_json = "1"
bytes = "1"
# Compact binary codec for the segmented substrate's per-command segment records (Fix A): each envelope is
# postcard-encoded ONCE when buffered (size measured from the kept bytes, never a throwaway serialize), and a
# sealed segment is the framed concatenation of those bytes — no JSON, no re-serialize on seal. Tiny, pure-Rust,
# serde-native; with default features off + `alloc` it pulls only `cobs` + `serde` (no heapless/std).
postcard = { version = "1", default-features = false, features = ["alloc"] }
# SigV4 signing for the minimal hand-rolled S3 client (`segmented::S3BlobStore`). Already in-tree for the
# relational projection crates; HMAC-SHA256 / canonical-request / HTTP/1.1 framing are hand-rolled on top so
# no async HTTP/S3 SDK (reqwest/hyper/object_store) is pulled — keeping the adapter's dependency surface lean.
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
pqueue-conformance = { path = "../pqueue-conformance" }
pqueue-release = { path = "../pqueue-release" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

[[test]]
name = "object_log_commit_recovery_tests"
path = "tests/object_log_commit_recovery_tests.rs"

[[test]]
name = "segmented_s3_substrate_tests"
path = "tests/segmented_s3_substrate_tests.rs"
