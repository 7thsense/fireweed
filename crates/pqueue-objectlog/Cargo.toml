[package]
name = "pqueue-objectlog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# Driven adapter (EVENTUAL-APPLY durability class): the command log is a set of immutable per-command
# objects on an object store (a local filesystem stands in for S3 here — no server). The projection is
# the shared `pqueue-projection` materialization, rebuilt from the object log. Upsert (atomic XDEL+XADD)
# is NOT offered on this class (Invariant 2) and returns `-ERR pqueue unavailable`.
[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-engine = { path = "../pqueue-engine" }
pqueue-projection = { path = "../pqueue-projection" }
serde = "1"
serde_json = "1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
pqueue-conformance = { path = "../pqueue-conformance" }
pqueue-release = { path = "../pqueue-release" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

[[test]]
name = "object_log_commit_recovery_tests"
path = "tests/object_log_commit_recovery_tests.rs"
