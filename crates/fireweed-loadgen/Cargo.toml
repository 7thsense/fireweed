[package]
name = "fireweed-loadgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# In-cluster RESP load generator for the TP-002 E2 multi-node kind harness (ADR-008: the queue is the unit
# of sharding). `run` drives the segmented object_log_sqlite_projection workload (pipelined XADD ingest,
# XREADGROUP > claim, XACK finalize) against a set of owner Services over the cluster network (pod->pod), and
# prints a measured per-run result JSON. `emit-row` folds three per-owner-count results (2/4/8) into one
# TP-002 E2 verification-ledger row, judging the release bars and strict-validating the row.
[[bin]]
name = "fireweed-loadgen"
path = "src/main.rs"

[dependencies]
fireweed-release = { path = "../fireweed-release" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
