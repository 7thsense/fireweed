# fireweed-bench is a SELF-CONTAINED workspace, deliberately separate from the root workspace: its
# at-scale throughput harness + the cross-queue scale-out evidence suite (TP-002) take real wall-clock
# measurements, which must run in ISOLATION — not interleaved with the root `cargo test --workspace` run
# (cargo executes sibling test binaries concurrently, which would steal cores and make throughput-scaling
# assertions flaky). Build/run it on its own: `cargo test --manifest-path crates/fireweed-bench/Cargo.toml`.
[workspace]

[package]
name = "fireweed-bench"
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "fireweed_bench"
path = "src/lib.rs"

[[bin]]
name = "fireweed-bench"
path = "src/main.rs"

[[bin]]
name = "fireweed-performance-matrix"
path = "src/bin/fireweed-performance-matrix.rs"

[[bin]]
name = "fireweed-million-cycle"
path = "src/bin/fireweed-million-cycle.rs"

# At-scale performance harness (TP-002 E0/E1/E3 substantiation): drives the four durable-log backends —
# the realized "log store" axis; the projection is the single shared `fireweed-projection` materialization —
# through ingest / claim+ack / recovery / queue-density workloads and reports throughput vs the E0 floor
# (>=10M items/hr per queue), batch-op latency percentiles, and rebuild-from-log recovery time.
#
# A NON-tokio executor (`futures::executor::block_on`) drives every backend uniformly: the sync `postgres`
# client panics under a tokio runtime, and all engine-port futures are already `ready`, so a plain executor
# works for memory/sqlite/objectlog/postgres alike.
[dependencies]
fireweed = { path = "../fireweed", features = ["postgres"] }
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
futures = "0.3"
bytes = "1"
ctrlc = "3"
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
fireweed-objectlog = { path = "../fireweed-objectlog" }
fireweed-release = { path = "../fireweed-release" }

[dev-dependencies]
