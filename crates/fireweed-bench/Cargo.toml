# fireweed-bench is a SELF-CONTAINED workspace, deliberately separate from the root workspace: its
# at-scale throughput harness + the cross-queue scale-out evidence suite (TP-002) take real wall-clock
# measurements, which must run in ISOLATION — not interleaved with the root `cargo test --workspace` run
# (unrelated tests or services would steal cores and distort throughput measurements). Build/run it on its own: `cargo test --manifest-path crates/fireweed-bench/Cargo.toml`.
[workspace]

[package]
name = "fireweed-bench"
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "fireweed_bench"
path = "src/lib.rs"

[[bin]]
name = "fireweed-bench"
path = "src/main.rs"

[[bin]]
name = "fireweed-performance-matrix"
path = "src/bin/fireweed-performance-matrix.rs"

[[bin]]
name = "fireweed-million-cycle"
path = "src/bin/fireweed-million-cycle.rs"

# Historical TP-002 throughput and recovery harness, alongside the current storage matrix.
# Native Turso and object-log operations run inside the library's Tokio reactor;
# synchronous PostgreSQL construction stays outside that reactor. The canonical
# recipient-workflow capacity gate lives in scripts/perf/qualify-workflow-capacity.sh.
[dependencies]
fireweed = { path = "../fireweed", features = ["postgres"] }
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
futures = "0.3"
bytes = "1"
ctrlc = "3"
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
fireweed-objectlog = { path = "../fireweed-objectlog" }
fireweed-release = { path = "../fireweed-release" }

[dev-dependencies]
