# fireweed-bench is a SELF-CONTAINED workspace, deliberately separate from the root workspace: it
# takes real wall-clock measurements, which must run in ISOLATION — not interleaved with the root
# `cargo test --workspace` run (unrelated tests or services would steal cores and distort throughput
# measurements). Build/run it on its own: `cargo run --manifest-path crates/fireweed-bench/Cargo.toml`.
[workspace]

[package]
name = "fireweed-bench"
version = "0.3.1"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
publish = false

# Internal API-007 reference runner over `QueueStore` (PostgreSQL, local object-log/Turso, S3/Turso).
[dependencies]
fireweed = { path = "../fireweed" }
fireweed-conformance = { path = "../fireweed-conformance" }
fireweed-core = { path = "../fireweed-core" }
fireweed-engine = { path = "../fireweed-engine" }
fireweed-objectlog = { path = "../fireweed-objectlog" }
fireweed-postgres = { path = "../fireweed-postgres" }
fireweed-queue-spool = { path = "../fireweed-queue-spool" }
futures = "0.3"
postgres = "0.19"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
url = "2"

[[bin]]
name = "fireweed-api007-reference"
path = "src/bin/fireweed-api007-reference.rs"
