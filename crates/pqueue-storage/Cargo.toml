[package]
name = "pqueue-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pqueue-core = { path = "../pqueue-core" }
parking_lot = "0.12"
bytes = "1"

[features]
default = []
object-log = []

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.44", features = ["rt", "macros"] }

[lib]
path = "src/lib.rs"
