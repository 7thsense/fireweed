[package]
name = "fireweed-interface-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "PostgreSQL implementation of the Fireweed data-plane interface (API-006), first increment."

[dependencies]
fireweed-interface = { path = "../fireweed-interface" }
fireweed-interface-engine = { path = "../fireweed-interface-engine" }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

[dev-dependencies]
futures = "0.3"
fireweed-interface-conformance = { path = "../fireweed-interface-conformance" }
