[package]
name = "fireweed-dsl-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "PostgreSQL executor for Fireweed's data-plane DSL (API-006): DDL from schemas and plain SQL for each statement."

[dependencies]
fireweed-dsl = { path = "../fireweed-dsl" }
serde_json = "1"
tokio-postgres = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
