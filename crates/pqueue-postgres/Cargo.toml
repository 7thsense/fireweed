[package]
name = "pqueue-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# TLS-capable Postgres connections for managed cloud endpoints (e.g. Databricks
# Lakebase, which requires sslmode=require). Off by default so the plain
# NoTls/testcontainers path needs no rustls toolchain.
tls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]
# Lakebase OAuth credential provider that shells out to the authenticated
# Databricks CLI (`database generate-database-credential`). Implies TLS.
lakebase = ["tls", "tokio/process"]

[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-storage = { path = "../pqueue-storage" }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-time-0_3"] }
serde_json = "1.0"
sha2 = "0.11"
time = "0.3"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
tokio = { version = "1.44", features = ["full"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
pqueue-core = { path = "../pqueue-core" }
pqueue-storage = { path = "../pqueue-storage" }

[lib]
path = "src/lib.rs"

[[test]]
name = "postgres_schema_migration_tests"
path = "tests/postgres_schema_migration_tests.rs"

[[test]]
name = "postgres_transaction_flow_tests"
path = "tests/postgres_transaction_flow_tests.rs"

[[test]]
name = "postgres_retention_tests"
path = "tests/postgres_retention_tests.rs"

[[test]]
name = "postgres_concurrency_claim_tests"
path = "tests/postgres_concurrency_claim_tests.rs"

[[test]]
name = "postgres_group_summary_tests"
path = "tests/postgres_group_summary_tests.rs"

[[test]]
name = "postgres_lease_lifecycle_tests"
path = "tests/postgres_lease_lifecycle_tests.rs"

[[test]]
