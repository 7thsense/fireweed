[package]
name = "pqueue-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pqueue-postgres-migrate"
path = "src/bin/pqueue-postgres-migrate.rs"

# Driven adapter: postgres (atomic durability class). Durable command LOG in postgres tables; the
# priority-ordered projection is the shared `pqueue-projection` materialization, rebuilt from the log.
# Mirrors `pqueue-sqlite` exactly — same template, same guarantees — over the SYNC `postgres` client.
# Depends inward on the domain (engine/core) + the shared projection — the correct hexagonal direction.
[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-engine = { path = "../pqueue-engine" }
pqueue-projection = { path = "../pqueue-projection" }
pqueue-objectlog = { path = "../pqueue-objectlog" }
axon-esf.workspace = true
postgres = "0.19"
native-tls = { version = "0.2", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
serde = "1"
serde_json = "1"
bytes = "1"
futures = "0.3"
# Lease-token hashing for the relational projection (hash-only at rest; parity with pqueue-sqlite).
sha2 = "0.11"

[features]
default = []
# Enable a native-tls connector so `sslmode=prefer|require` connects over TLS (Lakebase + cloud postgres).
tls = ["dep:native-tls", "dep:postgres-native-tls"]

[dev-dependencies]
# The library facade, driven as a COORDINATED owner over the postgres backend + control plane for the B5
# durable multi-instance competition test. `default-features = false` so we don't pull the other adapters.
pqueue = { path = "../pqueue", default-features = false }
# Runs the shared backend-conformance suite against the postgres backend (env-gated on PQUEUE_PG_TEST_URL).
pqueue-conformance = { path = "../pqueue-conformance" }
# The E0/E1 single-deployment baseline suite emits verification-ledger rows (TP-002 E0/E1) via this crate.
pqueue-release = { path = "../pqueue-release" }

[[test]]
name = "performance_single_deployment_baseline_tests"
path = "tests/performance_single_deployment_baseline_tests.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

# BQ-12: the postgres RELATIONAL backend's core + relational-reconnect class (env-gated on PQUEUE_PG_TEST_URL).
[[test]]
name = "relational_conformance"
path = "tests/relational_conformance.rs"

# ADR-012 P1b-ii: the UNIFIED postgres-relational COMPOSITION's core class (env-gated on PQUEUE_PG_TEST_URL).
[[test]]
name = "composed_relational_conformance"
path = "tests/composed_relational_conformance.rs"

# Live TLS round-trip proof (Lakebase / cloud-postgres transport): only compiled with `--features tls`,
# and env-gated on PQUEUE_PG_TLS_TEST_URL (a sslmode=require DSN to a TLS-enabled postgres). LOUD-skips otherwise.
[[test]]
name = "tls_connection"
path = "tests/tls_connection.rs"
