[package]
name = "pqueue-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pqueue-core = { path = "../pqueue-core" }
pqueue-storage = { path = "../pqueue-storage" }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-time-0_3"] }
serde_json = "1.0"
time = "0.3"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1.44", features = ["full"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
pqueue-core = { path = "../pqueue-core" }
pqueue-storage = { path = "../pqueue-storage" }

[lib]
path = "src/lib.rs"

[[test]]
name = "postgres_schema_migration_tests"
path = "tests/postgres_schema_migration_tests.rs"

[[test]]
name = "postgres_transaction_flow_tests"
path = "tests/postgres_transaction_flow_tests.rs"

[[test]]
name = "postgres_retention_tests"
path = "tests/postgres_retention_tests.rs"
