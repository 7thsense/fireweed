# Focused Turso lane: path-filtered, policy-governed qualification of the public
# default projection (ADR-016 / TD-010 / AC-TURSO-6).
#
# Turso is stock default (default feature closure on fireweed + fireweed-server).
# This workflow proves adapter suite + public facade/server composition without
# treating turso-projection as an opt-in solely to obtain default behavior.
name: turso projection

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/fireweed/**
      - crates/fireweed-conformance/**
      - crates/fireweed-engine/**
      - crates/fireweed-objectlog/**
      - crates/fireweed-projection/**
      - crates/fireweed-relational/**
      - crates/fireweed-server/**
      - crates/fireweed-turso/**
      - crates/fireweed-workload/**
      - .github/workflows/turso.yml
      - scripts/ci/s3-qualification-endpoint.sh
      - scripts/ci/s3-native-cas-preflight.py
      - scripts/ci/turso_workflow_fixtures.py
      - scripts/ci/verify-github-actions-policy.sh
      - scripts/ci/github-actions-policy-test.sh
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/fireweed/**
      - crates/fireweed-conformance/**
      - crates/fireweed-engine/**
      - crates/fireweed-objectlog/**
      - crates/fireweed-projection/**
      - crates/fireweed-relational/**
      - crates/fireweed-server/**
      - crates/fireweed-turso/**
      - crates/fireweed-workload/**
      - .github/workflows/turso.yml
      - scripts/ci/s3-qualification-endpoint.sh
      - scripts/ci/s3-native-cas-preflight.py
      - scripts/ci/turso_workflow_fixtures.py
      - scripts/ci/verify-github-actions-policy.sh
      - scripts/ci/github-actions-policy-test.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUST_TEST_THREADS: "1"
    # Disposable correctness fixture; reuse the PostgreSQL 16 Alpine kind fixture.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fireweed
          POSTGRES_PASSWORD: fireweed-test-only
          POSTGRES_DB: fireweed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fireweed -d fireweed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - name: Install repository check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Reuse Cargo build state
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify workflow policy
        run: bash scripts/ci/verify-github-actions-policy.sh

      - name: rustfmt
        run: cargo +1.97.1 fmt --all --check

      # Adapter suite: complete fireweed-turso local embedded WAL qualification.
      - name: fireweed-turso clippy (local)
        run: cargo +1.97.1 clippy -p fireweed-turso --all-targets --features local -- -D warnings

      - name: fireweed-turso tests (local)
        # Preserve the first panic if a later test aborts the process.
        run: cargo +1.97.1 test -p fireweed-turso --features local -- --nocapture

      # The workload suite and the full matrix require PostgreSQL and native conditional-create S3.
      # Keep fixture credentials outside the checkout and mask before GITHUB_ENV.
      - name: Provision matrix PostgreSQL/S3 fixtures
        timeout-minutes: 5
        shell: bash
        env:
          FIREWEED_S3_SECRET_DIR: ${{ runner.temp }}/fireweed-turso-s3-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash scripts/ci/s3-qualification-endpoint.sh provision
          bash scripts/ci/s3-qualification-endpoint.sh verify-isolation
          set -a
          source "${FIREWEED_S3_SECRET_DIR}/credentials.env"
          set +a
          pg_scheme=postgres
          pg_password=fireweed-test-only
          pg_url="${pg_scheme}://fireweed:${pg_password}@127.0.0.1:5432/fireweed"
          printf '::add-mask::%s\n' "$pg_password" "$pg_url" "$FIREWEED_S3_TEST_ACCESS_KEY" "$FIREWEED_S3_TEST_SECRET_KEY"
          printf 'FIREWEED_PG_TEST_URL=%s\n' "$pg_url" >> "$GITHUB_ENV"
          for key in FIREWEED_S3_TEST_ENDPOINT FIREWEED_S3_TEST_BUCKET FIREWEED_S3_TEST_REGION FIREWEED_S3_TEST_ACCESS_KEY FIREWEED_S3_TEST_SECRET_KEY; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done

      - name: Public workflow correctness and log recovery
        run: cargo +1.97.1 test -p fireweed-workload

      # Fireweed facade: 12-cell register Turso route leaves + composition matrix.
      - name: Fireweed 12-cell Turso route tests
        run: >
          cargo +1.97.1 test -p fireweed --all-features
          --test storage_matrix_t0_t2 storage_matrix_t0_t2_all_twelve_cells
          -- --exact

      - name: Fireweed facade Turso full matrix
        run: >
          cargo +1.97.1 test -p fireweed --all-features --lib
          storage_config_matrix_tests::turso_projection_full_facade_matrix
          -- --exact

      - name: Fireweed facade Turso feature and recovery boundaries
        run: >
          cargo +1.97.1 test -p fireweed --all-features --lib
          storage_config_matrix_tests::turso_projection_feature_and_recovery_boundaries
          -- --exact

      # Server: default feature closure (includes turso-projection) and all-features.
      - name: fireweed-server clippy (default features)
        run: cargo +1.97.1 clippy -p fireweed-server --all-targets -- -D warnings

      - name: fireweed-server clippy (all features)
        run: cargo +1.97.1 clippy -p fireweed-server --all-targets --all-features -- -D warnings

      # Broad live suites and Kafka remain in governed-product; the focused
      # storage matrix above owns only its PostgreSQL/S3 correctness fixtures.
      - name: Server configuration unit tests (default features)
        run: cargo +1.97.1 test -p fireweed-server --lib env_config::tests -- --test-threads=1

      - name: Server public configuration tests
        run: cargo +1.97.1 test -p fireweed-server --test env_config -- --test-threads=1

      # Exact public default selector + Class A delete-rebuild from authoritative log.
      - name: public default Turso env selector
        run: >
          cargo +1.97.1 test -p fireweed-server --all-features
          env_config::tests::turso_projection_is_the_public_env_default
          -- --exact

      - name: public projection help/parser bijection
        run: >
          cargo +1.97.1 test -p fireweed-server --all-features
          env_config::tests::public_projection_help_and_parser_are_bijective
          -- --exact

      - name: all four log specs accept Turso
        run: >
          cargo +1.97.1 test -p fireweed-server --all-features
          env_config::tests::all_four_log_specs_accept_turso
          -- --exact

      - name: Turso startup validation precedes storage I/O
        run: >
          cargo +1.97.1 test -p fireweed-server --all-features --test server
          turso_startup_validation_precedes_storage_io
          -- --exact

      - name: objectlog Turso delete-rebuild from authoritative log
        run: >
          cargo +1.97.1 test -p fireweed-server --all-features --test server
          objectlog_turso_profile_rebuilds_deleted_projection_from_authoritative_log
          -- --exact

      - name: memory × Turso server push/claim lifecycle
        run: >
          cargo +1.97.1 test -p fireweed-server --all-features --test server
          memory_turso_server_push_claim_lifecycle
          -- --exact

      - name: Repository shape test (public-default Turso lane)
        run: >
          cargo +1.97.1 test -p fireweed-server --test turso_workflow_shape
          turso_workflow_qualifies_the_public_default_projection
          -- --exact

      - name: Tear down matrix S3 fixture
        if: always()
        timeout-minutes: 2
        env:
          FIREWEED_S3_SECRET_DIR: ${{ runner.temp }}/fireweed-turso-s3-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci/s3-qualification-endpoint.sh teardown
