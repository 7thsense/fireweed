name: turso projection

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/fireweed-engine/**
      - crates/fireweed-objectlog/**
      - crates/fireweed-relational/**
      - crates/fireweed-server/**
      - crates/fireweed-turso/**
      - .github/workflows/turso.yml
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/fireweed-engine/**
      - crates/fireweed-objectlog/**
      - crates/fireweed-relational/**
      - crates/fireweed-server/**
      - crates/fireweed-turso/**
      - .github/workflows/turso.yml

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.92.0 fmt --all --check
      - run: cargo +1.92.0 clippy -p fireweed-turso -p fireweed-server --all-targets --features fireweed-server/turso-projection -- -D warnings
      - run: cargo +1.92.0 test -p fireweed-turso --features local
      - run: cargo +1.92.0 test -p fireweed-server --features turso-projection --test server objectlog_turso_profile_rebuilds_deleted_projection_from_authoritative_log -- --exact
