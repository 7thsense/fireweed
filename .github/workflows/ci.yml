name: ci

# The DSL crates: format, lint, dependency policy, and the executor's tests
# against PostgreSQL 18 (API-008 §Conformance).
on:
  pull_request:
    paths-ignore:
      - docs/site/**
      - SECURITY.md
      - SUPPORT.md
      - CODE_OF_CONDUCT.md
      - AGENTS.md
  push:
    branches:
      - main
    paths-ignore:
      - docs/site/**
      - SECURITY.md
      - SUPPORT.md
      - CODE_OF_CONDUCT.md
      - AGENTS.md

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      FIREWEED_PG_TEST_URL: postgres://postgres:fw@127.0.0.1:5432/fw
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fw
          POSTGRES_DB: fw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fw"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy

      - name: Reuse Cargo build state
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test against PostgreSQL 18
        run: cargo test --workspace

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
