name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pqueue
    steps:
      - name: Checkout pqueue
        uses: actions/checkout@v4
        with:
          path: pqueue

      - name: Checkout fjord dependency
        uses: actions/checkout@v4
        with:
          repository: telepathdata/fjord
          path: fjord
          ssh-key: ${{ secrets.FJORD_DEPLOY_KEY }}

      - name: Checkout object-log dependency
        uses: actions/checkout@v4
        with:
          repository: telepathdata/object-log
          path: object-log
          ssh-key: ${{ secrets.OBJECT_LOG_DEPLOY_KEY }}

      - name: Checkout heimq dependency
        uses: actions/checkout@v4
        with:
          repository: easel/heimq
          path: heimq

      - name: Install Rust 1.92.0
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview

      - name: Install Rust nightly for branch coverage
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview

      - name: Install cargo tooling
        run: |
          cargo install --locked cargo-deny --version 0.19.0
          cargo install --locked cargo-machete --version 0.9.1
          cargo install --locked cargo-llvm-cov --version 0.8.2

      - name: PR gate (enforcing)
        run: bash scripts/ci/pr-gate.sh --mode enforcing

  deployment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - postgres_native
          - object_log_sqlite_projection
    steps:
      - name: Checkout pqueue
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Helm static validation gate
        run: bash scripts/ci/helm-gate.sh

      - name: kind Helm integration proof (${{ matrix.backend }})
        env:
          KIND_NODE_IMAGE: kindest/node:v1.31.0
        run: bash scripts/ci/kind-helm-test.sh --backend ${{ matrix.backend }}
