name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.92.0
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy rustfmt

      - name: cargo fmt
        run: cargo +1.92.0 fmt --all --check

      - name: cargo clippy
        run: cargo +1.92.0 clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo +1.92.0 test --workspace
