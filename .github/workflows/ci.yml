name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    runs-on: ubuntu-latest
    # Run 38679816353 reached the 10-minute cap while facade tests were
    # still completing successfully. Bound the full serial release gate.
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Bounded formal analysis and checker controls
        run: |
          python3 -m unittest discover -s scripts/formal -p 'test_*.py'
          python3 scripts/formal/check.py --output target/formal-analysis.json
          python3 scripts/formal/check_source_group.py --output target/api007-formal/source-group.json
          python3 scripts/formal/generate_replay.py --output target/replay-corpus.json

      - name: Retain bounded formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-analysis
          path: |
            target/formal-analysis.json
            target/api007-formal/source-group.json
          if-no-files-found: error

      - name: Install repository check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt

      - name: Reuse Cargo build state
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # This standalone fixture has its own lockfile. Prime its complete
      # dependency closure before the release verifier's offline checks.
      - name: Fetch locked public boundary fixture dependencies
        timeout-minutes: 5
        run: cargo +1.99.0 fetch --locked --manifest-path scripts/ci/fixtures/public-crate-boundary/Cargo.toml

      - name: Enforce queue module boundaries and negative controls
        run: python3 scripts/ci/check_queue_boundaries.py --controls

      - name: Verify workflow policy
        run: bash scripts/ci/verify-github-actions-policy.sh

      # The public cell is S3 x Turso. Tests start the checksum-pinned RustFS on loopback.
      - name: Install pinned RustFS for S3 product tests
        timeout-minutes: 3
        run: echo "FIREWEED_RUSTFS_BIN=$(bash scripts/ci/s3-qualification-endpoint.sh install)" >> "$GITHUB_ENV"

      - name: Legacy model-to-S3/Turso regression replay
        run: |
          python3 scripts/formal/with_rustfs.py \
            --binary "$FIREWEED_RUSTFS_BIN" --replay-profile schedule-smoke --workers 8 \
            --output target/model-replay.json

      - name: Retain generated replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-replay
          path: |
            target/replay-corpus.json
            target/model-replay*.json
            target/model-replay.log
            target/model-replay-progress.jsonl
          if-no-files-found: error

      - name: Public release validation gate
        run: |
          python3 scripts/ci/public-release-gate.py \
            --manifest scripts/ci/public-release-gates-ci.json \
            --evidence target/public-release-gate.json


  api007-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL 16 and check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 ripgrep
          /usr/lib/postgresql/16/bin/postgres --version
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Reuse Cargo build state
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Qualification runner cancellation controls
        run: python3 scripts/ci/queue_pg_controls.py --pg-bin /usr/lib/postgresql/16/bin
      - name: Execute exact PostgreSQL correctness routes
        run: |
          python3 scripts/ci/queue-pg-execution.py \
            --pg-bin /usr/lib/postgresql/16/bin \
            --fixture-parent "$RUNNER_TEMP" \
            --output target/queue-pg-execution-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Storage remediation policy
        run: bash scripts/ci/storage-remediation-policy.sh --mode-file scripts/ci/storage-remediation-policy.mode --queue-evidence target/queue-pg-execution-${{ github.run_id }}-${{ github.run_attempt }}/report.json
      - name: Retain PostgreSQL correctness execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api007-postgres-execution
          path: target/queue-pg-execution-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
