name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    # The full `cargo test --workspace` links a test binary per crate; with default full DWARF debuginfo
    # that overflows the ~14 GB runner disk and the linker dies with SIGBUS. Keep line-tables-only debuginfo
    # (enough for backtraces) and disable incremental to keep the target dir within the runner's disk budget.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pqueue
    steps:
      # Reclaim ~25 GB of preinstalled tooling (dotnet/android/ghc) the Rust build never uses, so the
      # full-workspace test link has disk headroom (see the debuginfo note above).
      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Checkout pqueue
        uses: actions/checkout@v5
        with:
          path: pqueue

      # No dependency pre-checkouts needed: cargo resolves every git dependency itself, and all of them —
      # fjord (github.com/7thsense/fjord), heimq, and axon — are public, so they clone anonymously over
      # HTTPS with no deploy keys or credentials. (object-log is no longer a cargo dependency at all.)

      - name: Install Rust 1.92.0
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview

      - name: Install Rust nightly for branch coverage
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview

      - name: Install cargo tooling
        run: |
          cargo install --locked cargo-deny --version 0.19.0
          cargo install --locked cargo-machete --version 0.9.1
          cargo install --locked cargo-llvm-cov --version 0.8.2

      - name: Postgres conformance proof
        env:
          PQUEUE_PG_TEST_URL: postgres://postgres:pq@127.0.0.1:5432/postgres
        run: cargo +1.92.0 test -p pqueue-postgres --test conformance push_then_select_eligible_in_priority_order -- --nocapture

      - name: Exact Postgres TP-003 storage-pair proof
        env:
          PQUEUE_PG_TEST_URL: postgres://postgres:pq@127.0.0.1:5432/postgres
        run: |
          matrix_evidence=docs/perf/evidence/tp003-ac-txn-matrix-postgres-storage-pairs.jsonl
          parity_evidence=docs/perf/evidence/tp003-ac-txn-parity-postgres-storage-pairs.jsonl
          rm -f "$matrix_evidence" "$parity_evidence"
          cargo +1.92.0 test -p pqueue-conformance \
            --test external_transaction_contract_matrix_tests \
            ac_txn_contract_matrix_postgres_storage_pairs -- --exact --nocapture
          cargo +1.92.0 test -p pqueue-conformance \
            --test external_transaction_contract_matrix_tests \
            ac_txn_6_postgres_storage_pair_parity -- --exact --nocapture
          test -s "$matrix_evidence"
          test -s "$parity_evidence"
          cargo +1.92.0 run -p pqueue-release \
            --bin pqueue-verify-transaction-evidence -- \
            --evidence "$matrix_evidence" \
            --evidence "$parity_evidence"

      - name: Start MinIO (S3 object-log substrate)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break || sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb -p local/pqueue-test"

      - name: Embedded S3 + PostgreSQL projection proof
        env:
          PQUEUE_PG_TEST_URL: postgres://postgres:pq@127.0.0.1:5432/postgres
          PQUEUE_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          PQUEUE_S3_TEST_ACCESS_KEY: minioadmin
          PQUEUE_S3_TEST_SECRET_KEY: minioadmin
        run: >-
          cargo +1.92.0 test -p pqueue --features postgres
          --test embedded_objectlog_postgres
          public_s3_objectlog_postgres_open_and_reopen_with_disposable_projection
          -- --exact --nocapture

      - name: PR gate (enforcing)
        env:
          # Run the full postgres conformance/durability suite (not just the single proof test)
          # and the object-log S3 substrate tests inside the enforcing `cargo test --workspace`.
          PQUEUE_PG_TEST_URL: postgres://postgres:pq@127.0.0.1:5432/postgres
          PQUEUE_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          PQUEUE_S3_TEST_ACCESS_KEY: minioadmin
          PQUEUE_S3_TEST_SECRET_KEY: minioadmin
        run: bash scripts/ci/pr-gate.sh --mode enforcing

  deployment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - storage: objectlog-inmemory
            log_backend: objectlog
            projection_backend: inmemory
          - storage: objectlog-sqlite
            log_backend: objectlog
            projection_backend: sqlite
          - storage: objectlog-hybrid
            log_backend: objectlog
            projection_backend: hybrid
          - storage: objectlog-hybrid-async
            log_backend: objectlog
            projection_backend: hybrid-async
          - storage: postgres-inmemory
            log_backend: postgres
            projection_backend: inmemory
          - storage: postgres-sqlite
            log_backend: postgres
            projection_backend: sqlite
          - storage: postgres-postgres
            log_backend: postgres
            projection_backend: postgres
    steps:
      - name: Checkout pqueue
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Helm static validation gate
        run: bash scripts/ci/helm-gate.sh

      - name: kind Helm integration proof (${{ matrix.storage }})
        env:
          KIND_NODE_IMAGE: kindest/node:v1.31.0
        run: bash scripts/ci/kind-helm-test.sh --log-backend ${{ matrix.log_backend }} --projection-backend ${{ matrix.projection_backend }}
