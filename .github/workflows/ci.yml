name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Reuse Cargo build state
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify workflow policy
        run: bash scripts/ci/verify-github-actions-policy.sh

      - name: Public release validation gate
        run: |
          python3 scripts/ci/public-release-gate.py \
            --manifest scripts/ci/public-release-gates-ci.json \
            --evidence target/public-release-gate.json

      - name: Storage remediation policy
        run: bash scripts/ci/storage-remediation-policy.sh --mode-file scripts/ci/storage-remediation-policy.mode
