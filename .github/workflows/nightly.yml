name: extended functional checks

# Runs daily on the default branch and on demand. The large-scale tier lives
# here, not in ci.yml, so pushes and pull requests do not pay for it. A
# scheduled run has github.ref == refs/heads/main, so it may save caches.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    # A cold build took about 10 minutes before the S3 and PostgreSQL product
    # tests ran for real; 40 leaves headroom for them and the fixture setup.
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/ci/verify-github-actions-policy.sh
      # The lib tests include live PostgreSQL and S3 product tests that fail
      # closed without fixtures. nightly.yml may not declare service containers,
      # so PostgreSQL runs as a private cluster owned by the runner user (a
      # superuser, so tests can create throwaway databases). Credentials stay
      # outside the checkout and are masked before GITHUB_ENV.
      - name: Provision PostgreSQL/S3 fixtures
        timeout-minutes: 8
        shell: bash
        env:
          FIREWEED_S3_SECRET_DIR: ${{ runner.temp }}/fireweed-nightly-s3-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16
          pg_bin=/usr/lib/postgresql/16/bin
          pg_root="${RUNNER_TEMP}/fireweed-nightly-pg"
          pg_port=54329
          pg_password="$(openssl rand -hex 16)"
          printf '::add-mask::%s\n' "$pg_password"
          mkdir -p "$pg_root"
          printf '%s\n' "$pg_password" > "${pg_root}/pwfile"
          "${pg_bin}/initdb" -D "${pg_root}/data" -U fireweed --pwfile="${pg_root}/pwfile" --auth=scram-sha-256 --no-locale --encoding=UTF8
          "${pg_bin}/pg_ctl" -D "${pg_root}/data" -l "${pg_root}/server.log" -w -t 60 \
            -o "-p ${pg_port} -c listen_addresses=127.0.0.1 -c unix_socket_directories=${pg_root}" start
          PGPASSWORD="$pg_password" "${pg_bin}/createdb" -h 127.0.0.1 -p "$pg_port" -U fireweed fireweed
          bash scripts/ci/s3-qualification-endpoint.sh provision
          bash scripts/ci/s3-qualification-endpoint.sh verify-isolation
          set -a
          source "${FIREWEED_S3_SECRET_DIR}/credentials.env"
          set +a
          pg_scheme=postgres
          pg_url="${pg_scheme}://fireweed:${pg_password}@127.0.0.1:${pg_port}/fireweed"
          printf '::add-mask::%s\n' "$pg_url" "$FIREWEED_S3_TEST_ACCESS_KEY" "$FIREWEED_S3_TEST_SECRET_KEY"
          printf 'FIREWEED_PG_TEST_URL=%s\n' "$pg_url" >> "$GITHUB_ENV"
          for key in FIREWEED_S3_TEST_ENDPOINT FIREWEED_S3_TEST_BUCKET FIREWEED_S3_TEST_REGION FIREWEED_S3_TEST_ACCESS_KEY FIREWEED_S3_TEST_SECRET_KEY; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Extended workspace library tests
        run: cargo +1.99.0 test --workspace --lib --locked
      - name: Tear down S3 and PostgreSQL fixtures
        if: always()
        timeout-minutes: 2
        env:
          FIREWEED_S3_SECRET_DIR: ${{ runner.temp }}/fireweed-nightly-s3-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash scripts/ci/s3-qualification-endpoint.sh teardown
          /usr/lib/postgresql/16/bin/pg_ctl -D "${RUNNER_TEMP}/fireweed-nightly-pg/data" -m immediate -w -t 30 stop || true

  # The large-scale tier: Rust `::large::` lib tests and scripts/formal
  # large_test_*.py. Not run by ci.yml; nothing in the release gates waits on it.
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      # Same entry as ci.yml `functional`: same components, env and fireweed lib
      # build. Only main and this schedule write it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fireweed-lib
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned RustFS for S3 product tests
        timeout-minutes: 3
        run: echo "FIREWEED_RUSTFS_BIN=$(bash scripts/ci/s3-qualification-endpoint.sh install)" >> "$GITHUB_ENV"
      - name: Large-scale tier (fails when a tier runs zero tests)
        run: bash scripts/ci/large-tier-gate.sh
