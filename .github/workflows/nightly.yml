name: extended functional checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci/verify-github-actions-policy.sh
      - name: Extended workspace library tests
        run: cargo +1.97.1 test --workspace --lib --locked
