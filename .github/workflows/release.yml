name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.5"
        required: true
        default: "v0.2.5"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fireweed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: fireweed
    steps:
      - name: Checkout Fireweed
        uses: actions/checkout@v5
        with:
          path: fireweed
          fetch-depth: 0

      - name: Install pinned gitleaks
        shell: bash
        run: |
          bash scripts/ci/install-gitleaks.sh "${RUNNER_TEMP}/gitleaks-bin"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"

      - name: Block release on detected secrets
        shell: bash
        run: bash scripts/ci/gitleaks-gate.sh

      # No dependency pre-checkouts: cargo resolves every git dep itself and they are all public
      # (fjord=github.com/7thsense/fjord, heimq, axon), so they clone anonymously over HTTPS.

      - name: Free runner disk space
        working-directory: /
        run: |
          # The release gate (coverage via cargo-llvm-cov builds a second target tree) exhausts the
          # 14GB free on stock ubuntu-latest runners; v0.8.0 and the first v0.9.0 run both died with
          # "No space left on device". Drop the large preinstalled toolchains we never use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify release identity
        shell: bash
        run: |
          workspace_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "fireweed") | .version'
          )"
          test "${{ steps.release.outputs.tag }}" = "v${workspace_version}"
          test "${{ steps.release.outputs.version }}" = "${workspace_version}"
          test -f "docs/releases/v${workspace_version}.md"
          git fetch origin main --no-tags
          test "${GITHUB_SHA}" = "$(git rev-parse origin/main)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${workspace_version}"
          else
            git fetch origin "refs/tags/v${workspace_version}:refs/tags/v${workspace_version}"
            test "${GITHUB_SHA}" = "$(git rev-list -n 1 "v${workspace_version}")"
          fi

      - name: Acquire and preflight exact-revision governed evidence
        env:
          FIREWEED_GOVERNED_EVIDENCE_BASE_URL: ${{ vars.FIREWEED_GOVERNED_EVIDENCE_BASE_URL }}
        run: |
          test -n "$FIREWEED_GOVERNED_EVIDENCE_BASE_URL"
          evidence_url="${FIREWEED_GOVERNED_EVIDENCE_BASE_URL%/}/${GITHUB_SHA}.tar.gz"
          mkdir -p target
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$evidence_url" -o target/tp002-release.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${evidence_url}.sha256" -o target/tp002-release.tar.gz.sha256
          expected_sha="$(awk 'NR == 1 { print $1 }' target/tp002-release.tar.gz.sha256)"
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "$expected_sha  target/tp002-release.tar.gz" | sha256sum -c -
          test -z "$(tar -tzf target/tp002-release.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))')"
          tar -xzf target/tp002-release.tar.gz -C target
          test -s target/tp002-release/composite-contract.json
          test -s target/tp002-release/attestation.json

      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - run: cargo install --locked cargo-llvm-cov --version 0.8.2

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Functional and governed release gate
        env:
          FIREWEED_PG_TEST_URL: postgres://postgres:fireweed@127.0.0.1:5432/postgres
        run: |
          bash scripts/ci/verify-governed-release-composite.sh \
            --contract target/tp002-release/composite-contract.json \
            --expected-revision "$GITHUB_SHA"
          bash scripts/ci/release-gate.sh --governed-performance-only

      - name: Bind governed TP-002 evidence to exact release tag
        shell: bash
        run: |
          cargo +1.92.0 run -q -p fireweed-release \
            --bin fireweed-verify-evidence-attestation -- \
            --manifest target/tp002-release/attestation.json \
            --repo-root . \
            --tag "${{ steps.release.outputs.tag }}" \
            --commit "${GITHUB_SHA}"

      - name: Deployment release gate
        env:
          KIND_NODE_IMAGE: kindest/node:v1.31.0
          FIREWEED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          FIREWEED_PG_TEST_URL: postgres://postgres:fireweed@127.0.0.1:5432/postgres
        run: bash scripts/ci/deployment-release-gate.sh

      - name: Package binaries
        run: bash scripts/release/package-binaries.sh "${{ steps.release.outputs.version }}"

      - name: Package Helm chart
        run: |
          bash scripts/release/package-helm-chart.sh \
            --version "${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.tag }}" \
            --destination target/release-dist

      - name: Stage container image context
        run: |
          rm -rf target/release-image
          mkdir -p target/release-image
          cp target/release/fireweed-service target/release/fireweed-verify-ledger target/release-image/
          cp Dockerfile.prebuilt target/release-image/Dockerfile
          chmod 0755 target/release-image/fireweed-service target/release-image/fireweed-verify-ledger

      - name: Resolve container image coordinates
        id: container
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/fireweed-service"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${image}:${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Fireweed service image
        id: container-build
        uses: docker/build-push-action@v7
        with:
          context: ./fireweed/target/release-image
          file: ./fireweed/target/release-image/Dockerfile
          push: true
          tags: |
            ${{ steps.container.outputs.version_tag }}
            ${{ steps.container.outputs.sha_tag }}

      - name: Write container image release evidence
        env:
          IMAGE: ${{ steps.container.outputs.image }}
          VERSION_TAG: ${{ steps.container.outputs.version_tag }}
          SHA_TAG: ${{ steps.container.outputs.sha_tag }}
          DIGEST: ${{ steps.container-build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash scripts/release/write-container-image-evidence.sh \
            --image "$IMAGE" \
            --version "$VERSION" \
            --version-tag "$VERSION_TAG" \
            --sha-tag "$SHA_TAG" \
            --digest "$DIGEST" \
            --commit "$GITHUB_SHA" \
            --dockerfile Dockerfile.prebuilt \
            --output target/release-dist/fireweed-service-image.txt
          bash scripts/release/write-checksums.sh target/release-dist

      - name: Finalize deployment proof
        env:
          FIREWEED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          FIREWEED_RELEASE_DIST: target/release-dist
          FIREWEED_IMAGE_EVIDENCE_FILE: target/release-dist/fireweed-service-image.txt
        run: |
          bash scripts/ci/deployment-release-gate.sh --finalize-proof
          install -m 0644 \
            target/deployment-release-gate/deployment-proof.json \
            target/release-dist/deployment-proof.json
          install -m 0644 \
            target/deployment-release-gate/deployment-proof.md \
            target/release-dist/deployment-proof.md
          bash scripts/release/write-checksums.sh target/release-dist

      - name: Verify release artifact set
        run: |
          bash scripts/release/verify-release-artifacts.sh \
            --version "${{ steps.release.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --dist target/release-dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          notes="docs/releases/v${{ steps.release.outputs.version }}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes"
            gh release upload "$tag" target/release-dist/* --clobber
          else
            gh release create "$tag" target/release-dist/* \
              --title "$tag" \
              --notes-file "$notes"
          fi

      - name: Surface release workflow failure
        if: failure()
        run: bash scripts/ci/release-failure-notification.sh
