name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.5"
        required: true
        default: "v0.2.5"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pqueue
    steps:
      - name: Checkout pqueue
        uses: actions/checkout@v5
        with:
          path: pqueue
          fetch-depth: 0

      # No dependency pre-checkouts: cargo resolves every git dep itself and they are all public
      # (fjord=github.com/7thsense/fjord, heimq, axon), so they clone anonymously over HTTPS.

      - name: Free runner disk space
        working-directory: /
        run: |
          # The release gate (coverage via cargo-llvm-cov builds a second target tree) exhausts the
          # 14GB free on stock ubuntu-latest runners; v0.8.0 and the first v0.9.0 run both died with
          # "No space left on device". Drop the large preinstalled toolchains we never use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - run: cargo install --locked cargo-llvm-cov --version 0.8.2

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify release identity
        shell: bash
        run: |
          workspace_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "pqueue") | .version'
          )"
          test "${{ steps.release.outputs.tag }}" = "v${workspace_version}"
          test "${{ steps.release.outputs.version }}" = "${workspace_version}"
          test -f "docs/releases/v${workspace_version}.md"
          git fetch origin main --no-tags
          test "${GITHUB_SHA}" = "$(git rev-parse origin/main)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${workspace_version}"
          else
            git fetch origin "refs/tags/v${workspace_version}:refs/tags/v${workspace_version}"
            test "${GITHUB_SHA}" = "$(git rev-list -n 1 "v${workspace_version}")"
          fi

      - name: Exact Postgres TP-003 storage-pair proof
        env:
          PQUEUE_PG_TEST_URL: postgres://postgres:pq@127.0.0.1:5432/postgres
        run: |
          matrix_evidence=docs/perf/evidence/tp003-ac-txn-matrix-postgres-storage-pairs.jsonl
          parity_evidence=docs/perf/evidence/tp003-ac-txn-parity-postgres-storage-pairs.jsonl
          rm -f "$matrix_evidence" "$parity_evidence"
          cargo +1.92.0 test -p pqueue-conformance \
            --test external_transaction_contract_matrix_tests \
            ac_txn_contract_matrix_postgres_storage_pairs -- --exact --nocapture
          cargo +1.92.0 test -p pqueue-conformance \
            --test external_transaction_contract_matrix_tests \
            ac_txn_6_postgres_storage_pair_parity -- --exact --nocapture
          test -s "$matrix_evidence"
          test -s "$parity_evidence"
          cargo +1.92.0 run -p pqueue-release \
            --bin pqueue-verify-transaction-evidence -- \
            --evidence "$matrix_evidence" \
            --evidence "$parity_evidence"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Deployment release gate
        env:
          KIND_NODE_IMAGE: kindest/node:v1.31.0
          PQUEUE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PQUEUE_PG_TEST_URL: postgres://postgres:pq@127.0.0.1:5432/postgres
        # This deferral is intentionally version-bound so the next release must make a fresh decision.
        run: bash scripts/ci/deployment-release-gate.sh --defer-quiet-host-evidence-for 0.18.0

      - name: Package binaries
        run: bash scripts/release/package-binaries.sh "${{ steps.release.outputs.version }}"

      - name: Package Helm chart
        run: |
          bash scripts/release/package-helm-chart.sh \
            --version "${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.tag }}" \
            --destination target/release-dist

      - name: Stage container image context
        run: |
          rm -rf target/release-image
          mkdir -p target/release-image
          cp target/release/pqueue-service target/release/pqueue-verify-ledger target/release-image/
          cp Dockerfile.prebuilt target/release-image/Dockerfile
          chmod 0755 target/release-image/pqueue-service target/release-image/pqueue-verify-ledger

      - name: Resolve container image coordinates
        id: container
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/pqueue-service"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${image}:${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push pqueue service image
        id: container-build
        uses: docker/build-push-action@v7
        with:
          context: ./pqueue/target/release-image
          file: ./pqueue/target/release-image/Dockerfile
          push: true
          tags: |
            ${{ steps.container.outputs.version_tag }}
            ${{ steps.container.outputs.sha_tag }}

      - name: Write container image release evidence
        env:
          IMAGE: ${{ steps.container.outputs.image }}
          VERSION_TAG: ${{ steps.container.outputs.version_tag }}
          SHA_TAG: ${{ steps.container.outputs.sha_tag }}
          DIGEST: ${{ steps.container-build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash scripts/release/write-container-image-evidence.sh \
            --image "$IMAGE" \
            --version "$VERSION" \
            --version-tag "$VERSION_TAG" \
            --sha-tag "$SHA_TAG" \
            --digest "$DIGEST" \
            --commit "$GITHUB_SHA" \
            --dockerfile Dockerfile.prebuilt \
            --output target/release-dist/pqueue-service-image.txt
          bash scripts/release/write-checksums.sh target/release-dist

      - name: Finalize deployment proof
        env:
          PQUEUE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PQUEUE_RELEASE_DIST: target/release-dist
          PQUEUE_IMAGE_EVIDENCE_FILE: target/release-dist/pqueue-service-image.txt
        run: |
          bash scripts/ci/deployment-release-gate.sh --finalize-proof
          install -m 0644 \
            target/deployment-release-gate/deployment-proof.json \
            target/release-dist/deployment-proof.json
          install -m 0644 \
            target/deployment-release-gate/deployment-proof.md \
            target/release-dist/deployment-proof.md
          bash scripts/release/write-checksums.sh target/release-dist

      - name: Verify release artifact set
        run: |
          bash scripts/release/verify-release-artifacts.sh \
            --version "${{ steps.release.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --dist target/release-dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          notes="docs/releases/v${{ steps.release.outputs.version }}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes"
            gh release upload "$tag" target/release-dist/* --clobber
          else
            gh release create "$tag" target/release-dist/* \
              --title "$tag" \
              --notes-file "$notes"
          fi

      - name: Surface release workflow failure
        if: failure()
        run: bash scripts/ci/release-failure-notification.sh
