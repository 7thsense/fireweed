name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.5"
        required: true
        default: "v0.2.5"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pqueue
    steps:
      - name: Checkout pqueue
        uses: actions/checkout@v4
        with:
          path: pqueue
          fetch-depth: 0

      # No dependency pre-checkouts: cargo resolves every git dep itself and they are all public
      # (fjord=github.com/7thsense/fjord, heimq, axon), so they clone anonymously over HTTPS.

      - name: Free runner disk space
        working-directory: /
        run: |
          # The release gate (coverage via cargo-llvm-cov builds a second target tree) exhausts the
          # 14GB free on stock ubuntu-latest runners; v0.8.0 and the first v0.9.0 run both died with
          # "No space left on device". Drop the large preinstalled toolchains we never use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - run: cargo install --locked cargo-llvm-cov --version 0.8.2

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind

      - run: |
          bash scripts/ci/release-gate.sh --require-tp002-evidence E0,E1,E2,E3 \
            --tp002-e0e1-source pqueue-7e2b3132 \
            --tp002-e2-source pqueue-9afd88cc,pqueue-76d92a33 \
            --tp002-e3-source pqueue-b1abd895,pqueue-472a09d4

      - name: Deployment release gate
        env:
          KIND_NODE_IMAGE: kindest/node:v1.31.0
        run: bash scripts/ci/deployment-release-gate.sh

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package binaries
        run: bash scripts/release/package-binaries.sh "${{ steps.release.outputs.version }}"

      - name: Package Helm chart
        run: |
          bash scripts/release/package-helm-chart.sh \
            --version "${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.tag }}" \
            --destination target/release-dist

      - name: Stage container image context
        run: |
          rm -rf target/release-image
          mkdir -p target/release-image
          cp target/release/pqueue-service target/release/pqueue-verify-ledger target/release-image/
          cp Dockerfile.prebuilt target/release-image/Dockerfile
          chmod 0755 target/release-image/pqueue-service target/release-image/pqueue-verify-ledger

      - name: Resolve container image coordinates
        id: container
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/pqueue-service"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${image}:${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push pqueue service image
        id: container-build
        uses: docker/build-push-action@v6
        with:
          context: ./pqueue/target/release-image
          file: ./pqueue/target/release-image/Dockerfile
          push: true
          tags: |
            ${{ steps.container.outputs.version_tag }}
            ${{ steps.container.outputs.sha_tag }}

      - name: Write container image release evidence
        env:
          IMAGE: ${{ steps.container.outputs.image }}
          VERSION_TAG: ${{ steps.container.outputs.version_tag }}
          SHA_TAG: ${{ steps.container.outputs.sha_tag }}
          DIGEST: ${{ steps.container-build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash scripts/release/write-container-image-evidence.sh \
            --image "$IMAGE" \
            --version "$VERSION" \
            --version-tag "$VERSION_TAG" \
            --sha-tag "$SHA_TAG" \
            --digest "$DIGEST" \
            --commit "$GITHUB_SHA" \
            --dockerfile Dockerfile.prebuilt \
            --output target/release-dist/pqueue-service-image.txt
          bash scripts/release/write-checksums.sh target/release-dist

      - name: Verify release artifact set
        run: |
          bash scripts/release/verify-release-artifacts.sh \
            --version "${{ steps.release.outputs.version }}" \
            --dist target/release-dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" target/release-dist/* --clobber
          else
            gh release create "$tag" target/release-dist/* \
              --title "$tag" \
              --notes "pqueue $tag binary release. Storage is configured with separate log and projection backends."
          fi

      - name: Surface release workflow failure
        if: failure()
        run: bash scripts/ci/release-failure-notification.sh
