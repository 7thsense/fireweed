# Governed product lane (P13a framework + P13 populated allowlist/services).
#
# Destination for service-backed storage-matrix, Helm/kind, supported S3, and
# deterministic reduced-count functional/schema checks that must not run on the
# three-minute hosted ci.yml lane.
#
# Product-release readiness is NOT claimed by this lane alone:
#   - P13 populates scripts/ci/governed-product-allowlist.json commands and
#     scripts/ci/governed-product-services.json kafka image_digest/command.
#   - P13b provisions runner/credentials/ruleset and emits external proof.
#   - TP-005 authoritative performance remains forbidden in all CI.
#
# Hybrid product selectors are forbidden. release.yml remains P17r-owned.
name: governed-product

on:
  workflow_dispatch:
  # Path filters kept broad intentionally; required-check installation is P13b.
  # pull_request/push triggers may be enabled once P13b attaches the ruleset.

permissions:
  contents: read

concurrency:
  group: governed-product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    # Self-hosted/governed runner label is installed by P13b. Local syntax and
    # policy verification do not require the runner to exist.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      FIREWEED_GOVERNED_PRODUCT_LANE: "1"
      # product_release_readiness_claimed remains false until P13b proof exists.
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Reuse Cargo build state
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify workflow policy (zero-arg)
        run: bash scripts/ci/verify-github-actions-policy.sh

      - name: Validate P13-populated allowlist + services
        run: |
          python3 scripts/ci/generate-governed-product-allowlist.py --check
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          allow = json.loads(Path("scripts/ci/governed-product-allowlist.json").read_text())
          services = json.loads(Path("scripts/ci/governed-product-services.json").read_text())
          assert allow["product_release_readiness_claimed"] is False
          assert len(allow["commands"]) >= 8
          kafka = services["services"]["kafka_compatible_broker"]
          assert kafka["authorized"] is True
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", kafka["image_digest"])
          assert isinstance(kafka["command"], list) and kafka["command"][0] == "redpanda"
          print(
              f"governed-product: {len(allow['commands'])} commands; "
              f"kafka={kafka['image_repository']}@{kafka['image_digest'][:19]}…; "
              "product_release_readiness_claimed=false"
          )
          PY

      - name: Authorized kafka_compatible_broker pin (P8k / P13)
        # Pin lives in scripts/ci/governed-product-services.json only. This step
        # verifies the image is present (or pullable) and records the pin; the
        # allowlist p8k-external-kafka-fixture-preflight entry owns readiness/
        # sentinel produce-fetch on a run-owned ephemeral container.
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          services = json.loads(Path("scripts/ci/governed-product-services.json").read_text())
          kafka = services["services"]["kafka_compatible_broker"]
          assert kafka["authorized"] is True
          digest = kafka["image_digest"]
          pinned = kafka.get("image_pinned") or f"{kafka['image_repository']}@{digest}"
          cmd = kafka["command"]
          assert isinstance(cmd, list) and cmd[0] == "redpanda"
          print(f"kafka_compatible_broker authorized pin: {pinned}")
          print(f"static command: {' '.join(cmd)}")

          inspect = subprocess.run(
              ["docker", "image", "inspect", pinned],
              capture_output=True,
              text=True,
          )
          if inspect.returncode != 0:
              print(f"pulling pinned image {pinned}", flush=True)
              pull = subprocess.run(["docker", "pull", pinned], check=False)
              if pull.returncode != 0:
                  print(
                      "WARNING: pinned Redpanda image not available locally; "
                      "allowlist p8k preflight will fail closed if docker/image missing",
                      file=sys.stderr,
                  )
              else:
                  print("pinned image pulled")
          else:
              print("pinned image present locally")
          PY

      - name: Execute P13-populated allowlist commands
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          allow = json.loads(Path("scripts/ci/governed-product-allowlist.json").read_text())
          assert allow["product_release_readiness_claimed"] is False
          commands = allow["commands"]
          if not commands:
              raise SystemExit("governed-product allowlist empty after P13 population")

          # Refuse accidental authoritative-performance promotion in this lane.
          for token in allow.get("forbidden_in_lane", []):
              for entry in commands:
                  joined = " ".join(entry["command"])
                  if token in joined:
                      raise SystemExit(f"forbidden token {token!r} in {entry['id']}")

          for entry in commands:
              entry_id = entry["id"]
              command = entry["command"]
              print(f"--- governed command [{entry_id}]: {command!r} ---", flush=True)
              completed = subprocess.run(command, check=False)
              if completed.returncode != 0:
                  print(f"governed command failed: {entry_id} exit={completed.returncode}", file=sys.stderr)
                  sys.exit(completed.returncode)
          print(
              f"governed-product allowlist: all {len(commands)} commands passed; "
              "product_release_readiness_claimed=false"
          )
          PY
