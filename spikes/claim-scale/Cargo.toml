[workspace]

[package]
name = "spike-claim-scale"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
turso = { path = "../../vendor/turso", version = "=0.7.2", default-features = false }
turso_core = { path = "../../vendor/turso_core", version = "=0.7.2", default-features = false, features = [
    "fs",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
debug = false
