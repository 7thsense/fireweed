[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"

[licenses]
version = 2
# Permissive licenses only.
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "MIT-0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
