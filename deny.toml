[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2024-0436 (`paste` unmaintained): this is an UNMAINTAINED advisory, not a
# vulnerability — `paste` is a compile-time-only proc-macro with no runtime code path. It
# enters solely through heimq's vendored Kafka codec `heimq-protocol` (a bounded fork of
# kafka-protocol 0.15.1, which uses paste for its macro-generated message types). We do NOT
# depend on upstream kafka-protocol (see crates/pqueue-server/tests/heimq_protocol_bound_guard.rs,
# which fails if it reappears). heimq itself ignores this same advisory in its own deny.toml, so
# this is upstream-aligned; it clears when heimq rebases heimq-protocol onto a paste-free base.
ignore = ["RUSTSEC-2024-0436"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"

[licenses]
version = 2
# Permissive licenses only. ISC/BSD-3-Clause/MIT-0 enter via the rustls/aws-lc TLS stack
# (hyper-rustls <- metrics-exporter-prometheus <- heimq). All are OSI permissive.
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "MIT-0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
