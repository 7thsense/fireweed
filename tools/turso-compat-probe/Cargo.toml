[package]
name = "pqueue-turso-compat-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }
tempfile = "=3.23.0"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
turso = { version = "=0.7.0", default-features = false }
