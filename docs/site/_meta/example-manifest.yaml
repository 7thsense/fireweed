# Curated microsite examples extracted from the compiled queue_lifecycle example.
# Regenerate with: python3 scripts/site/extract_examples.py
# Verify with:     python3 scripts/site/check_example_provenance.py

examples:
  - slug: basic-lifecycle
    title: Provision, insert, claim, commit
    summary: >
      Open a throwaway Queue, provision a schema, insert two items, claim in
      priority order, complete each with a commit and read the stats.
    tags: [embed, lifecycle, beginner]
    category: embed
    sources:
      - path: crates/fireweed/examples/queue_lifecycle.rs
        symbol: schema
      - path: crates/fireweed/examples/queue_lifecycle.rs
        symbol: push_claim_complete

  - slug: scheduled-delivery
    title: Scheduled delivery and retry
    summary: >
      Work stays ineligible until available_at; a claimed item is sent back with
      Disposition::RetryAt and becomes claimable again once its time passes.
    tags: [eligibility, scheduling, retry]
    category: eligibility
    sources:
      - path: crates/fireweed/examples/queue_lifecycle.rs
        symbol: retry_and_schedule

  - slug: durable-open
    title: Open the production queue
    summary: >
      Queue::s3_turso with an S3 object log, a local Turso cache directory and
      PostgreSQL queue leases.
    tags: [durable, construction]
    category: construction
    sources:
      - path: crates/fireweed/examples/queue_lifecycle.rs
        symbol: open_production
