[package]
name = "fireweed-public-crate-boundary"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
fireweed = { path = "../../../../crates/fireweed", default-features = false, features = ["memory", "sqlite", "objectlog", "postgres"] }

[[bin]]
name = "supported"
path = "src/supported.rs"

[[bin]]
name = "raw-port"
path = "src/raw_port.rs"

[[bin]]
name = "internal-crate"
path = "src/internal_crate.rs"

[[bin]]
name = "backend-accessor"
path = "src/backend_accessor.rs"

[[bin]]
name = "legacy-generic-facade"
path = "src/legacy_pqueue.rs"

[[bin]]
name = "legacy-embedded-facade"
path = "src/legacy_embedded_pqueue.rs"

[[bin]]
name = "legacy-lib-backend"
path = "src/legacy_lib_backend.rs"

[[bin]]
name = "legacy-embedded-handle"
path = "src/legacy_embedded_handle.rs"

[[bin]]
name = "legacy-generic-constructor"
path = "src/legacy_pqueue_new.rs"

[[bin]]
name = "legacy-embedded-config"
path = "src/legacy_embedded_config.rs"
