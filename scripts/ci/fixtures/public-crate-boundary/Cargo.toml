[package]
name = "fireweed-public-crate-boundary"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
fireweed = { path = "../../../../crates/fireweed", default-features = false, features = ["memory", "sqlite", "objectlog", "postgres"] }

[[bin]]
name = "supported"
path = "src/supported.rs"

[[bin]]
name = "raw-port"
path = "src/raw_port.rs"

[[bin]]
name = "internal-crate"
path = "src/internal_crate.rs"

[[bin]]
name = "backend-accessor"
path = "src/backend_accessor.rs"

[[bin]]
name = "rejected-retired-generic-facade"
path = "src/rejected_retired_generic_facade.rs"

[[bin]]
name = "rejected-retired-embedded-facade"
path = "src/rejected_retired_embedded_facade.rs"

[[bin]]
name = "rejected-retired-lib-backend"
path = "src/rejected_retired_lib_backend.rs"

[[bin]]
name = "rejected-retired-embedded-handle"
path = "src/rejected_retired_embedded_handle.rs"

[[bin]]
name = "rejected-retired-generic-constructor"
path = "src/rejected_retired_generic_constructor.rs"

[[bin]]
name = "rejected-retired-embedded-config"
path = "src/rejected_retired_embedded_config.rs"
