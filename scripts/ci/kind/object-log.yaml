apiVersion: v1
kind: ConfigMap
metadata:
  name: object-log-fixture
  labels:
    app.kubernetes.io/name: object-log-fixture
    app.kubernetes.io/part-of: fireweed-kind-smoke
data:
  s3-fixture.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path
    from urllib.parse import unquote, urlparse

    ROOT = Path("/data")

    def object_path(raw_path: str) -> Path:
        parsed = urlparse(raw_path)
        parts = [
            part
            for part in unquote(parsed.path).split("/")
            if part and part not in (".", "..")
        ]
        return ROOT.joinpath(*parts)

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.send_header("content-length", "2")
                self.end_headers()
                self.wfile.write(b"ok")
                return

            path = object_path(self.path)
            if not path.is_file():
                self.send_response(404)
                self.send_header("content-length", "0")
                self.end_headers()
                return

            body = path.read_bytes()
            self.send_response(200)
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_PUT(self):
            length = int(self.headers.get("content-length", "0"))
            body = self.rfile.read(length)
            path = object_path(self.path)
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(body)
            self.send_response(200)
            self.send_header("content-length", "0")
            self.end_headers()

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args), flush=True)

    if __name__ == "__main__":
        ROOT.mkdir(parents=True, exist_ok=True)
        ThreadingHTTPServer(("0.0.0.0", 9000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: object-log-fixture
    app.kubernetes.io/part-of: fireweed-kind-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: object-log-fixture
      app.kubernetes.io/part-of: fireweed-kind-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-log-fixture
        app.kubernetes.io/part-of: fireweed-kind-smoke
    spec:
      containers:
        - name: object-log-fixture
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/s3-fixture.py
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: script
          configMap:
            name: object-log-fixture
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: object-log-fixture
    app.kubernetes.io/part-of: fireweed-kind-smoke
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: object-log-fixture
    app.kubernetes.io/part-of: fireweed-kind-smoke
  ports:
    - name: http
      port: 9000
      targetPort: http
